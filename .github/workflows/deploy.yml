name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - static
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t blog:latest .

    - name: Save Docker image
      run: |
        docker save blog:latest | gzip > blog.tar.gz

    - name: Copy image to server
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "blog.tar.gz,docker-compose.yml"
        target: "/tmp/blog_deploy/"

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /tmp/blog_deploy
          
          # 加载镜像
          docker load -i blog.tar.gz
          
          # 确保数据目录存在（服务器上的持久化目录）
          mkdir -p /home/xiangxu/project/blog/data
          chmod 755 /home/xiangxu/project/blog/data
          
          # 创建或更新 docker-compose.yml（确保挂载配置正确）
          cat > /home/xiangxu/project/blog/docker-compose.yml << 'EOF'
          version: '3.8'
          
          services:
            blog:
              image: blog:latest
              container_name: blog
              ports:
                - "8080:8080"
              volumes:
                # 挂载 data 目录到本地磁盘，实现数据持久化
                - /home/xiangxu/project/blog/data:/app/data
              restart: unless-stopped
              environment:
                - GIN_MODE=release
                - TZ=Asia/Shanghai
          EOF
          
          # 停止并删除旧容器
          cd /home/xiangxu/project/blog
          docker-compose down || true
          
          # 启动新容器（会自动使用挂载的目录）
          docker-compose up -d
          
          # 清理临时文件
          docker image prune -f
          rm -rf /tmp/blog_deploy
          
          # 验证部署
          sleep 5
          docker ps | grep blog
          docker logs blog | tail -20


