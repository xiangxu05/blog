<script>
  // 文章详情页面初始化函数
  window.initArticleDetailPage = function (routeData) {
    console.log('初始化文章详情页面', routeData);

    // 安全获取路由参数
    const params = routeData && routeData.params ? routeData.params : {};
    const articleId = params.id;
    let version = params.version;

    // 如果没有版本参数，默认使用 'latest'
    if (!version) {
      version = 'latest';
      console.log('未提供版本参数，使用默认值: latest');
    }

    if (!articleId) {
      console.error('文章ID缺失:', { articleId, version, routeData });
      showArticleError('无效的文章链接');
      return;
    }

    // 存储文章信息到全局
    window.currentArticle = { id: articleId, version: version };

    // 加载文章详情
    loadArticleDetail();

    // 绑定事件
    bindArticleEvents();

    // 初始化阅读进度追踪
    initReadingProgress();
  };

  // 全局变量 - 避免重复声明
  if (typeof window.articleData === 'undefined') {
    window.articleData = null;
  }
  if (typeof window.articleContent === 'undefined') {
    window.articleContent = null;
  }

  // 加载文章详情（两步加载机制）
  window.loadArticleDetail = async function () {
    const { id, version } = window.currentArticle;

    try {
      // 显示加载状态
      showArticleLoading();

      // 第一步：获取文章元数据
      console.log('第一步：获取文章元数据', { id, version });

      const response = await fetch(`/api/articles/${id}/${version}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include'
      });

      if (!response.ok) {
        throw new Error(`获取文章详情失败: ${response.status} ${response.statusText}`);
      }

      const result = await response.json();
      console.log('文章详情响应:', result);

      if (result.code !== 200) {
        throw new Error(result.msg || '获取文章详情失败');
      }

      window.articleData = result.data;
      if (!window.articleData) {
        throw new Error('文章数据为空');
      }

      // 显示文章基本信息
      displayArticleInfo(window.articleData);

      loadArticleSocial();
      initCommentsUI();
      loadComments();

      // 第二步：根据store_id加载文章内容
      if (window.articleData.store_id) {
        await loadArticleContent();
      } else {
        showContentError('文章内容不存在');
      }

    } catch (error) {
      console.error('加载文章详情失败:', error);
      showArticleError(error.message || '文章加载失败');
    }
  };

  // 加载文章内容
  window.loadArticleContent = async function () {
    if (!window.articleData || !window.articleData.store_id) {
      showContentError('无法获取文章内容');
      return;
    }

    try {
      // 显示内容加载状态
      showContentLoading();

      console.log('第二步：根据store_id下载文章内容', window.articleData.store_id);

      const response = await fetch(`/api/files/download/${window.articleData.store_id}`, {
        method: 'GET',
        credentials: 'include'
      });

      if (!response.ok) {
        throw new Error(`下载文章内容失败: ${response.status} ${response.statusText}`);
      }

      window.articleContent = await response.text();
      console.log('文章内容下载成功，长度:', window.articleContent.length);

      // 渲染Markdown内容
      await renderMarkdownContent(window.articleContent);

      // 生成目录
      generateTableOfContents();

      // 显示文章容器
      hideContentLoading();

    } catch (error) {
      console.error('加载文章内容失败:', error);
      showContentError(error.message || '文章内容加载失败');
    }
  };

  // 显示文章基本信息
  function displayArticleInfo(article) {

    // 设置文章标题
    document.getElementById('article-title').textContent = article.title;
    document.title = `${article.title} - 个人博客`;

    // 设置元数据
    const publishDate = article.created_at ? new Date(article.created_at).toLocaleDateString('zh-CN') : '未知时间';
    document.getElementById('article-date').textContent = publishDate;
    document.getElementById('article-category').textContent = article.category || '未分类';
    document.getElementById('article-views').textContent = article.views || 0;

    // 设置文章描述
    if (article.description) {
      document.getElementById('article-description').innerHTML = `
      <i class="fas fa-info-circle me-2"></i>
      ${escapeHtml(article.description)}
    `;
    } else {
      document.getElementById('article-description').style.display = 'none';
    }

    // 设置标签
    if (article.tags) {
      const tags = article.tags.split(',').filter(tag => tag.trim());
      const tagsHtml = tags.map(tag =>
        `<span class="article-tag">${escapeHtml(tag.trim())}</span>`
      ).join('');
      document.getElementById('article-tags').innerHTML = tagsHtml;
    }

    // 设置侧边栏信息
    document.getElementById('info-publish-date').textContent = publishDate;
    const updateDate = article.updated_at ? new Date(article.updated_at).toLocaleDateString('zh-CN') : '未知时间';
    document.getElementById('info-update-date').textContent = updateDate;
    document.getElementById('info-version').textContent = article.version || '1';

    // 设置分享链接
    const shareUrl = window.location.href;
    document.getElementById('share-url').value = shareUrl;

    // 隐藏加载状态，显示文章容器
    hideArticleLoading();
  }

  /** 剥离 Jekyll/Obsidian 风格 YAML front matter，避免正文与目录被 front matter 污染 */
  function stripYamlFrontMatter(md) {
    if (typeof md !== 'string' || md.length < 4) return md;
    const t = md.replace(/^\uFEFF/, '').trimStart();
    if (!t.startsWith('---')) return md;
    const lines = t.split(/\r?\n/);
    if (lines[0].trim() !== '---') return md;
    for (let i = 1; i < lines.length; i++) {
      if (lines[i].trim() === '---') {
        return lines.slice(i + 1).join('\n').replace(/^\s+/, '');
      }
    }
    return md;
  }

  // 渲染Markdown内容
  async function renderMarkdownContent(content) {
    const contentContainer = document.getElementById('article-content');

    try {
      const bodyMd = stripYamlFrontMatter(content);

      // 使用marked.js渲染Markdown
      const renderer = new marked.Renderer();

      // 自定义渲染器
      renderer.heading = function (text, level) {
        const id = text.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-');
        return `<h${level} id="${id}">${text}</h${level}>`;
      };

      renderer.code = function (code, language) {
        const langClass = language ? ` class="language-${language}"` : '';
        return `<pre><code${langClass}>${escapeHtml(code)}</code></pre>`;
      };

      // 配置marked选项
      marked.setOptions({
        renderer: renderer,
        highlight: function (code, lang) {
          if (window.hljs && lang && window.hljs.getLanguage(lang)) {
            try {
              return window.hljs.highlight(code, { language: lang }).value;
            } catch (e) {
              console.warn('代码高亮失败:', e);
            }
          }
          return escapeHtml(code);
        },
        breaks: true,
        gfm: true
      });

      // 渲染内容
      const htmlContent = marked.parse(bodyMd);
      contentContainer.innerHTML = htmlContent;

      // 计算字数和阅读时间（按去掉 front matter 后的正文）
      const wordCount = bodyMd.length;
      const readingTime = Math.ceil(wordCount / 500); // 假设每分钟阅读500字

      document.getElementById('info-word-count').textContent = wordCount;
      document.getElementById('info-read-time').textContent = `${readingTime} 分钟`;
      document.getElementById('reading-time').textContent = readingTime;

      // 高亮代码块
      if (window.hljs) {
        window.hljs.highlightAll();
      }

      // 显示内容
      contentContainer.classList.remove('d-none');

    } catch (error) {
      console.error('Markdown渲染失败:', error);
      contentContainer.innerHTML = `
      <div class="alert alert-warning-custom">
        <i class="fas fa-exclamation-triangle me-2"></i>
        内容渲染出现问题，显示原始内容
      </div>
      <pre class="bg-light p-3 rounded">${escapeHtml(content)}</pre>
    `;
      contentContainer.classList.remove('d-none');
    }
  }

  // 生成目录
  function generateTableOfContents() {
    const headings = document.querySelectorAll('#article-content h1, #article-content h2, #article-content h3, #article-content h4');

    if (headings.length === 0) {
      const qn = document.getElementById('quick-nav');
      const qnc = document.getElementById('quick-nav-content');
      if (qn) qn.classList.add('d-none');
      if (qnc) qnc.innerHTML = '';
      return;
    }

    const tocContainer = document.getElementById('table-of-contents');
    const tocContent = document.getElementById('toc-content');
    const quickNavContent = document.getElementById('quick-nav-content');

    let tocHtml = '<ul class="list-unstyled">';
    let quickNavHtml = '';

    headings.forEach((heading, index) => {
      const level = parseInt(heading.tagName[1]);
      const text = heading.textContent;
      const id = heading.id || `heading-${index}`;

      if (!heading.id) {
        heading.id = id;
      }

      const indent = level > 1 ? `style="margin-left: ${(level - 1) * 15}px"` : '';

      tocHtml += `
      <li ${indent}>
        <a href="#${id}" class="text-decoration-none text-muted">${text}</a>
      </li>
    `;

      /* 与主栏目录一致：h1–h4 均进入快速导航（仅 h5/h6 不入，避免过长） */
      if (level <= 4) {
        quickNavHtml += `
        <a href="#${id}" class="btn btn-outline-custom btn-sm mb-2 d-block text-start">
          ${text}
        </a>
      `;
      }
    });

    tocHtml += '</ul>';

    tocContent.innerHTML = tocHtml;
    tocContainer.classList.remove('d-none');

    if (quickNavHtml) {
      quickNavContent.innerHTML = quickNavHtml;
      const qn = document.getElementById('quick-nav');
      /* 仅去掉 d-none；勿用 d-lg-block，避免与 d-none 组合在部分环境下不显示 */
      qn.classList.remove('d-none');
      /* 大屏有侧栏导航时，主栏目录隐藏，避免重复 */
      tocContainer.classList.add('d-lg-none');
    } else {
      tocContainer.classList.remove('d-lg-none');
    }

    // 平滑滚动到锚点
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        // 检查href是否有效（不是空的'#'）
        if (href && href !== '#' && href.length > 1) {
          const target = document.querySelector(href);
          if (target) {
            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        }
      });
    });
  }

  // 初始化阅读进度
  function initReadingProgress() {
    const progressBar = document.getElementById('reading-progress');
    const progressPercent = document.getElementById('progress-percent');

    window.addEventListener('scroll', function () {
      const article = document.getElementById('article-content');
      if (!article) return;

      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight - windowHeight;
      const scrollTop = window.pageYOffset;

      const progress = Math.min(100, Math.max(0, (scrollTop / documentHeight) * 100));

      progressBar.style.width = progress + '%';
      progressPercent.textContent = Math.round(progress);
    });
  }

  /** 将正文内图片 src 转为绝对地址，避免相对路径在打印预览中解析错误 */
  function absolutizeArticleContentImages() {
    const root = document.getElementById('article-content');
    if (!root) return;
    const base = window.location.href;
    root.querySelectorAll('img[src]').forEach(function (img) {
      const s = img.getAttribute('src');
      if (!s || /^https?:\/\//i.test(s) || s.startsWith('data:') || s.startsWith('blob:')) return;
      try {
        img.setAttribute('src', new URL(s, base).href);
      } catch (e) {
        /* ignore */
      }
    });
  }

  /**
   * 打印：在当前文档内打印（不新开 about:blank），仅标题 + Markdown 正文；通过 body 类 + @media print 隐藏其余 UI。
   */
  function printArticleForPrint() {
    const contentEl = document.getElementById('article-content');
    if (!contentEl || contentEl.classList.contains('d-none')) {
      window.blogApp.showNotification('请先等待文章加载完成', 'warning');
      return;
    }
    if (!contentEl.innerHTML.trim()) {
      window.blogApp.showNotification('没有可打印的内容', 'warning');
      return;
    }
    absolutizeArticleContentImages();

    /* 不往 body 加 class：避免部分浏览器 afterprint 不触发导致样式残留；打印样式仅用 @media print */
    requestAnimationFrame(function () {
      window.print();
    });
  }

  // 绑定事件
  function bindArticleEvents() {
    // 分享按钮
    document.getElementById('share-btn')?.addEventListener('click', function () {
      new bootstrap.Modal(document.getElementById('share-modal')).show();
    });

    // 收藏（顶部与底部两个按钮，需分别绑定；勿重复使用同一 id）
    async function onBookmarkToggle() {
      if (!window.appState.isAuthenticated()) {
        page('/login?redirect=' + encodeURIComponent(window.location.pathname));
        return;
      }
      const aid = parseInt(window.currentArticle.id, 10);
      try {
        const s = await window.apiClient.articles.getSocial(aid);
        if (s.bookmarked) {
          await window.apiClient.articles.unbookmark(aid);
        } else {
          await window.apiClient.articles.bookmark(aid);
        }
        await loadArticleSocial();
        window.blogApp.showNotification(s.bookmarked ? '已取消收藏' : '已加入收藏', 'success');
      } catch (err) {
        window.blogApp.showNotification(err.message || '操作失败', 'error');
      }
    }
    document.getElementById('bookmark-btn-top')?.addEventListener('click', onBookmarkToggle);
    document.getElementById('bookmark-btn-footer')?.addEventListener('click', onBookmarkToggle);

    // 打印：同页打印，仅标题 + 正文（见 printArticleForPrint）
    document.getElementById('print-btn')?.addEventListener('click', printArticleForPrint);

    // 点赞（需登录，可取消）
    document.getElementById('like-btn')?.addEventListener('click', async function () {
      if (!window.appState.isAuthenticated()) {
        page('/login?redirect=' + encodeURIComponent(window.location.pathname));
        return;
      }
      const aid = parseInt(window.currentArticle.id, 10);
      try {
        const s = await window.apiClient.articles.getSocial(aid);
        if (s.liked) {
          await window.apiClient.articles.unlike(aid);
        } else {
          await window.apiClient.articles.like(aid);
        }
        await loadArticleSocial();
      } catch (err) {
        window.blogApp.showNotification(err.message || '操作失败', 'error');
      }
    });

    // 评论按钮：滚动到评论区
    document.getElementById('comment-btn')?.addEventListener('click', function () {
      document.getElementById('comments-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.getElementById('comment-input')?.focus();
    });
  }

  window.commentReplyParentId = null;

  function initCommentsUI() {
    const authed = window.appState && window.appState.isAuthenticated && window.appState.isAuthenticated();
    const compose = document.getElementById('comment-compose');
    const hint = document.getElementById('comment-login-hint');
    if (authed) {
      compose?.classList.remove('d-none');
      hint?.classList.add('d-none');
    } else {
      compose?.classList.add('d-none');
      hint?.classList.remove('d-none');
    }

    document.getElementById('comment-submit')?.addEventListener('click', submitComment);
    document.getElementById('comment-cancel-reply')?.addEventListener('click', cancelReply);
  }

  function cancelReply() {
    window.commentReplyParentId = null;
    const el = document.getElementById('comment-reply-hint');
    const btn = document.getElementById('comment-cancel-reply');
    if (el) el.textContent = '';
    btn?.classList.add('d-none');
  }

  async function loadComments() {
    const id = window.currentArticle && window.currentArticle.id;
    if (!id || !window.apiClient) return;
    const listEl = document.getElementById('comments-list');
    const emptyEl = document.getElementById('comments-empty');
    const errEl = document.getElementById('comments-error');
    errEl?.classList.add('d-none');
    try {
      const expandedCollapseIds = [];
      listEl.querySelectorAll('.collapse.show').forEach(function (el) {
        if (el.id) expandedCollapseIds.push(el.id);
      });

      const data = await window.apiClient.comments.list(id, { page: 1, page_size: 50 });
      const items = (data && data.comments) ? data.comments : [];
      document.getElementById('comments-count').textContent = '(' + ((data && data.pagination && data.pagination.total_count) || items.length) + ')';
      if (!items.length) {
        listEl.innerHTML = '';
        emptyEl?.classList.remove('d-none');
        return;
      }
      emptyEl?.classList.add('d-none');
      listEl.innerHTML = buildCommentThreadsHTML(items);
      bindCommentActions();

      expandedCollapseIds.forEach(function (collapseId) {
        const el = document.getElementById(collapseId);
        if (!el || !el.classList.contains('collapse')) return;
        try {
          if (typeof bootstrap !== 'undefined' && bootstrap.Collapse) {
            const inst = bootstrap.Collapse.getOrCreateInstance(el, { toggle: false });
            inst.show();
          } else {
            el.classList.add('show');
          }
        } catch (e) {
          el.classList.add('show');
        }
        const btn = listEl.querySelector('[data-bs-target="#' + collapseId.replace(/"/g, '') + '"]');
        if (btn) btn.setAttribute('aria-expanded', 'true');
      });
    } catch (e) {
      console.error(e);
      errEl.textContent = '评论加载失败，请稍后刷新';
      errEl?.classList.remove('d-none');
    }
  }

  /** 按 parent_id 分组子评论，同一父下按时间排序 */
  function groupCommentsByParent(items) {
    const byParent = new Map();
    items.forEach((c) => {
      if (c.parent_id == null || c.parent_id === undefined) return;
      const k = Number(c.parent_id);
      if (!byParent.has(k)) byParent.set(k, []);
      byParent.get(k).push(c);
    });
    byParent.forEach((arr) => {
      arr.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    });
    return byParent;
  }

  /** 顶层评论 + 楼中楼（子树默认折叠）；父评论不在本页时当作顶层显示 */
  function buildCommentThreadsHTML(items) {
    const byParent = groupCommentsByParent(items);
    const idSet = new Set(items.map((c) => Number(c.id)));
    const roots = items.filter((c) => {
      if (c.parent_id == null || c.parent_id === undefined) return true;
      return !idSet.has(Number(c.parent_id));
    });
    roots.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    if (!roots.length) return '';
    return roots.map((r) => renderCommentThread(r, byParent)).join('');
  }

  function renderCommentThread(c, byParent) {
    const children = byParent.get(Number(c.id)) || [];
    const card = renderCommentCard(c);
    if (!children.length) {
      return `<div class="comment-thread border-bottom py-3">${card}</div>`;
    }
    const cid = 'comment-replies-' + c.id;
    const inner = children.map((ch) => renderCommentThreadNested(ch, byParent, 1)).join('');
    return `
      <div class="comment-thread border-bottom py-3">
        ${card}
        <div class="${commentRepliesNestClass(1)}">
          <button type="button" class="btn btn-link btn-sm p-0 text-muted comment-replies-toggle d-flex align-items-center gap-1"
            data-bs-toggle="collapse" data-bs-target="#${cid}" aria-expanded="false">
            <i class="fas fa-reply fa-flip-horizontal"></i>
            <span>${children.length} 条回复</span>
            <i class="fas fa-chevron-down small comment-replies-chevron"></i>
          </button>
          <div class="collapse" id="${cid}">${inner}</div>
        </div>
      </div>`;
  }

  /** 视觉层级：depth 1～2 逐级缩进；depth≥3 不再增加左边距（仍保留折叠与「回复 @」） */
  function commentRepliesNestClass(depth) {
    var base = 'comment-replies-nest mt-2 ps-2 border-start border-secondary';
    if (depth >= 3) {
      return base + ' comment-replies-nest--deep';
    }
    if (depth === 2) {
      return base + ' ms-2';
    }
    return base + ' ms-3';
  }

  function commentItemNestedClass(depth) {
    var cls = 'comment-item-nested pt-3 mt-2 border-top border-light';
    if (depth >= 3) {
      cls += ' comment-item-nested--deep';
    }
    return cls;
  }

  /** 子层评论卡片（无顶边 border-bottom，由外层折叠包裹） */
  function renderCommentThreadNested(c, byParent, depth) {
    if (depth == null || depth < 1) depth = 1;
    const children = byParent.get(Number(c.id)) || [];
    const card = renderCommentCard(c);
    if (!children.length) {
      return `<div class="${commentItemNestedClass(depth)}">${card}</div>`;
    }
    const cid = 'comment-replies-' + c.id;
    const inner = children.map((ch) => renderCommentThreadNested(ch, byParent, depth + 1)).join('');
    return `
      <div class="${commentItemNestedClass(depth)}">
        ${card}
        <div class="${commentRepliesNestClass(depth)}">
          <button type="button" class="btn btn-link btn-sm p-0 text-muted comment-replies-toggle d-flex align-items-center gap-1"
            data-bs-toggle="collapse" data-bs-target="#${cid}" aria-expanded="false">
            <i class="fas fa-reply fa-flip-horizontal"></i>
            <span>${children.length} 条回复</span>
            <i class="fas fa-chevron-down small comment-replies-chevron"></i>
          </button>
          <div class="collapse" id="${cid}">${inner}</div>
        </div>
      </div>`;
  }

  function renderCommentCard(c) {
    const replyTo = c.reply_to
      ? `<div class="small text-muted mb-1">回复 <strong>${escapeHtml(c.reply_to.nickname || '')}</strong></div>`
      : '';
    const profile = window.appState.getState('user.profile');
    const myId = profile && profile.user_id;
    const canDelete = myId != null && (c.author.user_id === myId || window.appState.isAdmin());
    const canEdit = myId != null && c.author.user_id === myId;
    const delBtn = canDelete
      ? `<button type="button" class="btn btn-link btn-sm text-danger p-0 ms-2 comment-del" data-id="${c.id}">删除</button>`
      : '';
    const editBtn = canEdit
      ? `<button type="button" class="btn btn-link btn-sm p-0 ms-2 comment-edit" data-id="${c.id}">编辑</button>`
      : '';
    const replyBtn = window.appState.isAuthenticated()
      ? `<button type="button" class="btn btn-link btn-sm p-0 ms-2 comment-reply" data-id="${c.id}" data-nick="${escapeHtml(c.author.nickname || c.author.username)}">回复</button>`
      : '';
    const lc = c.like_count != null ? c.like_count : 0;
    const liked = !!c.liked;
    const likePart = window.appState.isAuthenticated()
      ? `<button type="button" class="btn btn-link btn-sm p-0 ms-2 comment-like ${liked ? 'text-primary' : 'text-muted'}" data-id="${c.id}" data-liked="${liked}"><i class="fas fa-thumbs-up"></i> ${lc}</button>`
      : `<span class="text-muted small ms-2"><i class="fas fa-thumbs-up"></i> ${lc}</span>`;

    const editedHint = c.edited && c.updated_at
      ? `<span class="text-muted small">（编辑过 ${escapeHtml(c.updated_at)}）</span>`
      : '';

    return `
      <div class="comment-item" data-comment-id="${c.id}">
        ${replyTo}
        <div class="d-flex gap-2">
          <img src="${escapeHtml(c.author.avatar || '/assets/images/default-avatar.svg?v=2')}" alt="" class="rounded-circle" width="40" height="40" style="object-fit:cover;" onerror="this.onerror=null;this.src='/assets/images/default-avatar.svg?v=2'">
          <div class="flex-grow-1 min-w-0">
            <div class="d-flex flex-wrap align-items-baseline gap-2">
              <strong class="small">${escapeHtml(c.author.nickname || c.author.username)}</strong>
              <span class="text-muted small">${escapeHtml(c.created_at)}</span>${editedHint}
              ${likePart}${replyBtn}${editBtn}${delBtn}
            </div>
            <div class="comment-body mt-1">${escapeHtml(c.content).replace(/\n/g, '<br>')}</div>
          </div>
        </div>
      </div>`;
  }

  function bindCommentActions() {
    document.querySelectorAll('.comment-reply').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (!window.appState.isAuthenticated()) return;
        const id = parseInt(btn.getAttribute('data-id'), 10);
        const nick = btn.getAttribute('data-nick') || '';
        window.commentReplyParentId = id;
        const hint = document.getElementById('comment-reply-hint');
        const cancel = document.getElementById('comment-cancel-reply');
        if (hint) hint.textContent = `回复 @${nick}`;
        cancel?.classList.remove('d-none');
        document.getElementById('comments-section')?.scrollIntoView({ behavior: 'smooth' });
        document.getElementById('comment-input')?.focus();
      });
    });
    document.querySelectorAll('.comment-del').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'), 10);
        if (!confirm('确定删除这条评论？')) return;
        try {
          await window.apiClient.comments.delete(id);
          window.blogApp.showNotification('已删除', 'success');
          loadComments();
        } catch (err) {
          window.blogApp.showNotification(err.message || '删除失败', 'error');
        }
      });
    });
    document.querySelectorAll('.comment-edit').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'), 10);
        const item = btn.closest('.comment-item');
        const body = item && item.querySelector('.comment-body');
        const oldText = body ? body.innerText.replace(/\s+$/,'') : '';
        const nc = window.prompt('编辑评论', oldText);
        if (nc == null) return;
        const t = nc.trim();
        if (!t) return;
        try {
          await window.apiClient.comments.update(id, { content: t });
          window.blogApp.showNotification('已更新', 'success');
          loadComments();
        } catch (err) {
          window.blogApp.showNotification(err.message || '更新失败', 'error');
        }
      });
    });
    document.querySelectorAll('.comment-like').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'), 10);
        const liked = btn.getAttribute('data-liked') === 'true';
        try {
          if (liked) {
            await window.apiClient.comments.unlike(id);
          } else {
            await window.apiClient.comments.like(id);
          }
          loadComments();
        } catch (err) {
          window.blogApp.showNotification(err.message || '操作失败', 'error');
        }
      });
    });
  }

  async function loadArticleSocial() {
    const id = window.currentArticle && window.currentArticle.id;
    if (!id || !window.apiClient || !window.apiClient.articles.getSocial) return;
    try {
      const s = await window.apiClient.articles.getSocial(id);
      const n = s.like_count != null ? s.like_count : 0;
      const le = document.getElementById('like-count');
      if (le) le.textContent = n;
      const likeBtn = document.getElementById('like-btn');
      if (likeBtn) {
        if (s.liked) {
          likeBtn.classList.add('active', 'btn-success');
          likeBtn.classList.remove('btn-outline-success');
        } else {
          likeBtn.classList.remove('active', 'btn-success');
          likeBtn.classList.add('btn-outline-success');
        }
      }
      document.querySelectorAll('.article-bookmark-btn').forEach(function (bm) {
        if (s.bookmarked) {
          bm.classList.add('active');
        } else {
          bm.classList.remove('active');
        }
      });
      const btxt = document.getElementById('bookmark-text');
      if (btxt) {
        btxt.textContent = s.bookmarked ? '已收藏' : '收藏';
      }
    } catch (e) {
      console.warn('loadArticleSocial', e);
    }
  }

  async function submitComment() {
    const input = document.getElementById('comment-input');
    const text = (input && input.value) ? input.value.trim() : '';
    if (!text) {
      window.blogApp.showNotification('请输入评论内容', 'warning');
      return;
    }
    const id = window.currentArticle && window.currentArticle.id;
    if (!id) return;
    const body = { content: text };
    if (window.commentReplyParentId) {
      body.parent_id = window.commentReplyParentId;
    }
    try {
      await window.apiClient.comments.create(id, body);
      input.value = '';
      cancelReply();
      window.blogApp.showNotification('评论已发布', 'success');
      loadComments();
    } catch (err) {
      window.blogApp.showNotification(err.message || '发送失败', 'error');
    }
  }

  // 显示状态函数
  function showArticleLoading() {
    document.getElementById('article-loading').classList.remove('d-none');
    document.getElementById('article-container').classList.add('d-none');
    document.getElementById('article-error').classList.add('d-none');
  }

  function hideArticleLoading() {
    document.getElementById('article-loading').classList.add('d-none');
    document.getElementById('article-container').classList.remove('d-none');
  }

  function showArticleError(message) {
    document.getElementById('article-loading').classList.add('d-none');
    document.getElementById('article-container').classList.add('d-none');
    document.getElementById('article-error').classList.remove('d-none');
    document.getElementById('article-error').querySelector('p').textContent = message;
  }

  function showContentLoading() {
    document.getElementById('content-loading').classList.remove('d-none');
    document.getElementById('article-content').classList.add('d-none');
    document.getElementById('content-error').classList.add('d-none');
  }

  function hideContentLoading() {
    document.getElementById('content-loading').classList.add('d-none');
  }

  function showContentError(message) {
    document.getElementById('content-loading').classList.add('d-none');
    document.getElementById('content-error').classList.remove('d-none');
    document.getElementById('content-error').querySelector('p').textContent = message;
  }

  // 分享功能
  function shareToWeibo() {
    const title = encodeURIComponent(document.getElementById('article-title').textContent);
    const url = encodeURIComponent(window.location.href);
    window.open(`https://service.weibo.com/share/share.php?title=${title}&url=${url}`, '_blank');
  }

  function shareToTwitter() {
    const title = encodeURIComponent(document.getElementById('article-title').textContent);
    const url = encodeURIComponent(window.location.href);
    window.open(`https://twitter.com/intent/tweet?text=${title}&url=${url}`, '_blank');
  }

  function shareToQQ() {
    const title = encodeURIComponent(document.getElementById('article-title').textContent);
    const url = encodeURIComponent(window.location.href);
    window.open(`https://connect.qq.com/widget/shareqq/index.html?title=${title}&url=${url}`, '_blank');
  }

  function copyLink() {
    copyShareUrl();
  }

  function copyShareUrl() {
    const shareUrl = document.getElementById('share-url');
    shareUrl.select();
    document.execCommand('copy');
    window.blogApp.showNotification('链接已复制到剪贴板', 'success');
  }

  // HTML转义函数
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
