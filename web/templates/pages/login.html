<div class="container-wide py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card-custom">
        <div class="card-body">
          <div class="text-center mb-4">
            <h2 class="card-title">用户登录</h2>
            <p class="text-muted">欢迎回来，请登录您的账户</p>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label for="username" class="form-label-custom">用户名</label>
              <input type="text" class="form-control form-control-custom" id="username" name="username" required>
              <div class="invalid-feedback" id="username-error"></div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label-custom">密码</label>
              <div class="position-relative">
                <input type="password" class="form-control form-control-custom" id="password" name="password" required>
                <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-2"
                  id="toggle-password" style="border: none; background: none;">
                  <i class="fas fa-eye text-muted"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="password-error"></div>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="remember-me" name="remember">
              <label class="form-check-label" for="remember-me">
                记住我
              </label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="login-btn">
              <span class="btn-text">登录</span>
              <span class="spinner-border spinner-border-sm d-none" id="login-spinner"></span>
            </button>

            <div class="text-center">
              <p class="mb-0">
                还没有账户？
                <a href="/register" class="text-decoration-none">立即注册</a>
              </p>
            </div>
          </form>

          <!-- 错误提示 -->
          <div class="alert alert-danger-custom d-none" id="login-error" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="login-error-message"></span>
          </div>

          <!-- 成功提示 -->
          <div class="alert alert-success-custom d-none" id="login-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span id="login-success-message"></span>
          </div>
        </div>
      </div>

      <!-- 功能说明 -->
      <div class="card-custom mt-4">
        <div class="card-body">
          <h6 class="card-title">
            <i class="fas fa-info-circle me-2"></i>
            登录说明
          </h6>
          <ul class="list-unstyled mb-0 small text-muted">
            <li><i class="fas fa-check text-success me-2"></i>支持用户名登录</li>
            <li><i class="fas fa-check text-success me-2"></i>会话自动管理</li>
            <li><i class="fas fa-check text-success me-2"></i>安全认证保护</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 登录页面初始化函数
  window.initLoginPage = function (routeData) {
    console.log('初始化登录页面');

    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeCheckbox = document.getElementById('remember-me');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const loginBtn = document.getElementById('login-btn');
    const loginSpinner = document.getElementById('login-spinner');
    const loginError = document.getElementById('login-error');
    const loginSuccess = document.getElementById('login-success');

    // 从本地存储加载保存的用户名
    const savedUsername = localStorage.getItem('rememberedUsername');
    if (savedUsername && usernameInput) {
      usernameInput.value = savedUsername;
      if (rememberMeCheckbox) {
        rememberMeCheckbox.checked = true;
      }
    }

    // 密码显示/隐藏切换
    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        const icon = this.querySelector('i');
        icon.className = type === 'password' ? 'fas fa-eye text-muted' : 'fas fa-eye-slash text-muted';
      });
    }

    // 表单验证
    function validateForm() {
      let isValid = true;

      // 验证用户名
      if (!usernameInput.value.trim()) {
        showFieldError('username', '请输入用户名');
        isValid = false;
      } else if (usernameInput.value.trim().length < 3) {
        showFieldError('username', '用户名至少3个字符');
        isValid = false;
      } else {
        clearFieldError('username');
      }

      // 验证密码
      if (!passwordInput.value) {
        showFieldError('password', '请输入密码');
        isValid = false;
      } else if (passwordInput.value.length < 6) {
        showFieldError('password', '密码至少6个字符');
        isValid = false;
      } else {
        clearFieldError('password');
      }

      return isValid;
    }

    // 显示字段错误
    function showFieldError(fieldName, message) {
      const field = document.getElementById(fieldName);
      const errorEl = document.getElementById(fieldName + '-error');

      if (field) {
        field.classList.add('is-invalid');
      }
      if (errorEl) {
        errorEl.textContent = message;
      }
    }

    // 清除字段错误
    function clearFieldError(fieldName) {
      const field = document.getElementById(fieldName);
      const errorEl = document.getElementById(fieldName + '-error');

      if (field) {
        field.classList.remove('is-invalid');
      }
      if (errorEl) {
        errorEl.textContent = '';
      }
    }

    // 显示全局错误
    function showError(message) {
      if (loginError) {
        document.getElementById('login-error-message').textContent = message;
        loginError.classList.remove('d-none');
      }
      if (loginSuccess) {
        loginSuccess.classList.add('d-none');
      }
    }

    // 显示成功信息  
    function showSuccess(message) {
      if (loginSuccess) {
        document.getElementById('login-success-message').textContent = message;
        loginSuccess.classList.remove('d-none');
      }
      if (loginError) {
        loginError.classList.add('d-none');
      }
    }

    // 隐藏所有提示
    function hideMessages() {
      if (loginError) {
        loginError.classList.add('d-none');
      }
      if (loginSuccess) {
        loginSuccess.classList.add('d-none');
      }
    }

    // 设置加载状态
    function setLoading(loading) {
      if (loginBtn && loginSpinner) {
        if (loading) {
          loginBtn.disabled = true;
          loginBtn.querySelector('.btn-text').textContent = '登录中...';
          loginSpinner.classList.remove('d-none');
        } else {
          loginBtn.disabled = false;
          loginBtn.querySelector('.btn-text').textContent = '登录';
          loginSpinner.classList.add('d-none');
        }
      }
    }

    // 表单提交处理
    if (form) {
      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        // 隐藏之前的消息
        hideMessages();

        // 验证表单
        if (!validateForm()) {
          return;
        }

        try {
          // 设置加载状态
          setLoading(true);

          // 获取表单数据
          const formData = new FormData(form);
          const credentials = {
            username: formData.get('username').trim(),
            password: formData.get('password')
          };
          const rememberMe = formData.get('remember');

          // 调用登录API
          const response = await window.apiClient.user.login(credentials);

          // 处理"记住我"功能
          if (rememberMe) {
            // 保存用户名到本地存储
            localStorage.setItem('rememberedUsername', credentials.username);
          } else {
            // 清除保存的用户名
            localStorage.removeItem('rememberedUsername');
          }

          // 显示成功消息
          showSuccess('登录成功，正在跳转...');

          // 更新用户状态
          window.appState.setUser(response.user_info);

          // 获取重定向地址
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect') || '/';

          // 延迟跳转以显示成功消息
          setTimeout(() => {
            window.router.push(redirectUrl);
          }, 1000);

        } catch (error) {
          console.error('登录失败:', error);
          showError(error.message || '登录失败，请检查用户名和密码');
        } finally {
          setLoading(false);
        }
      });
    }

    // 输入时清除错误状态
    [usernameInput, passwordInput].forEach(input => {
      if (input) {
        input.addEventListener('input', function () {
          if (this.classList.contains('is-invalid')) {
            clearFieldError(this.name);
          }
          hideMessages();
        });
      }
    });

    // 处理"记住我"复选框变化
    if (rememberMeCheckbox) {
      rememberMeCheckbox.addEventListener('change', function () {
        if (!this.checked) {
          // 如果取消勾选，立即清除保存的用户名
          localStorage.removeItem('rememberedUsername');
        }
      });
    }

    // 检查是否有重定向参数
    const urlParams = new URLSearchParams(window.location.search);
    const redirectParam = urlParams.get('redirect');
    if (redirectParam) {
      showError('请先登录以访问该页面');
    }

    // 聚焦到用户名输入框
    if (usernameInput) {
      usernameInput.focus();
    }
  };
</script>
