<div class="container-wide py-4">
  <div class="row">
    <!-- 搜索和筛选栏 -->
    <div class="col-12 mb-4">
      <div class="card-custom">
        <div class="card-body">
          <div class="row align-items-center">
            <!-- 搜索框 -->
            <div class="col-md-4 mb-3 mb-md-0">
              <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="form-control form-control-custom" id="search-input"
                  placeholder="搜索文章标题或内容...">
              </div>
            </div>

            <!-- 搜索选项 -->
            <div class="col-md-2 mb-3 mb-md-0">
              <select class="form-select-custom" id="search-type-filter" title="搜索类型">
                <option value="fuzzy">模糊搜索</option>
                <option value="exact">精确搜索</option>
              </select>
            </div>

            <!-- 搜索字段 -->
            <div class="col-md-2 mb-3 mb-md-0">
              <select class="form-select-custom" id="search-fields-filter" title="搜索范围">
                <option value="all">全部字段</option>
                <option value="title">仅标题</option>
                <option value="content">仅内容</option>
                <option value="tags">仅标签</option>
              </select>
            </div>

            <!-- 分类筛选 -->
            <div class="col-md-2 mb-3 mb-md-0">
              <select class="form-select-custom" id="category-filter">
                <option value="">全部分类</option>
                <!-- 分类选项将通过JavaScript动态加载 -->
              </select>
            </div>

            <!-- 排序方式 -->
            <div class="col-md-2 mb-3 mb-md-0">
              <select class="form-select-custom" id="sort-filter">
                <option value="created_at_desc">最新发布</option>
                <option value="created_at_asc">最早发布</option>
                <option value="title_asc">标题 A-Z</option>
                <option value="title_desc">标题 Z-A</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主内容区域 -->
    <div class="col-lg-8">
      <!-- 文章列表头部 -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
          <h2 class="h3 mb-1">
            <i class="fas fa-newspaper me-2 text-primary"></i>
            全部文章
          </h2>
          <p class="text-muted mb-0" id="articles-count">共 0 篇文章</p>
        </div>

        <div class="d-flex align-items-center gap-2">
          <!-- 分页数量选择 -->
          <div class="d-flex align-items-center gap-2">
            <label for="page-size-select" class="text-muted small mb-0" style="white-space: nowrap; flex-shrink: 0;">每页显示：</label>
            <select class="form-select-custom form-select-sm" id="page-size-select" style="width: auto; min-width: 80px;">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
          </div>

          <!-- 视图切换 -->
          <div class="btn-group" role="group" id="view-toggle">
            <input type="radio" class="btn-check" name="view-mode" id="list-view" value="list" checked>
            <label class="btn btn-outline-custom" for="list-view">
              <i class="fas fa-list"></i>
            </label>

            <input type="radio" class="btn-check" name="view-mode" id="grid-view" value="grid">
            <label class="btn btn-outline-custom" for="grid-view">
              <i class="fas fa-th"></i>
            </label>
          </div>
        </div>
      </div>

      <!-- 文章列表容器 -->
      <div id="articles-container">
        <!-- 加载状态 -->
        <div id="articles-loading" class="text-center py-5">
          <div class="spinner-border text-primary mb-3" role="status">
            <span class="visually-hidden">加载中...</span>
          </div>
          <p class="text-muted">正在加载文章...</p>
        </div>

        <!-- 文章列表 -->
        <div id="articles-list" class="d-none">
          <!-- 文章卡片将通过JavaScript动态渲染 -->
        </div>

        <!-- 空状态 -->
        <div id="articles-empty" class="text-center py-5 d-none">
          <i class="fas fa-file-alt fa-3x text-muted mb-3"></i>
          <h4 class="text-muted">没有找到文章</h4>
          <p class="text-muted">尝试调整搜索条件或浏览其他分类</p>
        </div>

        <!-- 错误状态 -->
        <div id="articles-error" class="alert alert-danger-custom d-none">
          <i class="fas fa-exclamation-triangle me-2"></i>
          <strong>加载失败</strong>
          <p class="mb-2">无法加载文章列表，请稍后重试</p>
          <button class="btn btn-outline-danger btn-sm" onclick="window.loadArticlesList()">
            <i class="fas fa-refresh me-2"></i>重新加载
          </button>
        </div>
      </div>

      <!-- 分页导航 -->
      <nav id="pagination-nav" class="d-none" aria-label="文章分页">
        <ul class="pagination pagination-custom justify-content-center" id="pagination">
          <!-- 分页链接将通过JavaScript动态生成 -->
        </ul>
      </nav>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
      <!-- 热门标签 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-fire me-2"></i>
            热门文章
          </h5>
          <div id="popular-articles">
            <div class="text-center py-3">
              <div class="spinner-border spinner-border-sm text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 文章标签云 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-tags me-2"></i>
            标签云
          </h5>
          <div id="tags-cloud">
            <div class="d-flex flex-wrap gap-2">
              <span class="article-tag">加载中...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 文章归档 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-archive me-2"></i>
            文章归档
          </h5>
          <div id="articles-archive">
            <div class="list-group list-group-flush">
              <div class="list-group-item px-0 d-flex justify-content-between">
                <span>2024年12月</span>
                <span class="badge badge-secondary-custom">3</span>
              </div>
              <div class="list-group-item px-0 d-flex justify-content-between">
                <span>2024年11月</span>
                <span class="badge badge-secondary-custom">5</span>
              </div>
              <div class="list-group-item px-0 d-flex justify-content-between">
                <span>2024年10月</span>
                <span class="badge badge-secondary-custom">4</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 订阅提醒 -->
      <div class="card-custom">
        <div class="card-body text-center">
          <i class="fas fa-bell fa-2x text-primary mb-3"></i>
          <h6 class="card-title">订阅更新</h6>
          <p class="text-muted small">获取最新文章推送</p>
          <button class="btn btn-primary-custom btn-sm" id="subscribe-updates-btn">
            <i class="fas fa-envelope me-2"></i>立即订阅
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 文章列表页面初始化函数
  window.initArticlesPage = async function (routeData) {
    console.log('初始化文章列表页面');

    // 初始化搜索和筛选
    await initFilters();

    // 加载文章列表
    loadArticlesList();

    // 加载侧边栏数据
    loadSidebarData();

    // 绑定事件
    bindArticlesEvents();
  };

  // 全局变量
  if (typeof window.currentFilters === 'undefined') {
    window.currentFilters = {
      page: 1,
      page_size: 10,
      search: '',
      search_type: 'fuzzy',
      search_fields: 'all',
      category: '',
      sort: 'created_at_desc'
    };
  }

  if (typeof window.articlesIsLoading === 'undefined') {
    window.articlesIsLoading = false;
  }

  // 加载分类列表
  async function loadCategories() {
    try {
      const response = await window.apiClient.categories.getList();
      const categoryFilter = document.getElementById('category-filter');

      // 清空现有选项（保留"全部分类"）
      categoryFilter.innerHTML = '<option value="">全部分类</option>';

      // 添加动态分类选项
      if (response && response.length > 0) {
        response.forEach(category => {
          const option = document.createElement('option');
          option.value = category.name;
          option.textContent = category.name;
          categoryFilter.appendChild(option);
        });
      }
    } catch (error) {
      console.error('加载分类列表失败:', error);
      // 如果加载失败，保持默认的分类选项
    }
  }

  // 初始化筛选器
  async function initFilters() {
    // 先加载分类列表
    await loadCategories();

    // 从URL参数中恢复筛选条件
    const urlParams = new URLSearchParams(window.location.search);

    window.currentFilters.search = urlParams.get('search') || '';
    window.currentFilters.search_type = urlParams.get('search_type') || 'fuzzy';
    window.currentFilters.search_fields = urlParams.get('search_fields') || 'all';
    window.currentFilters.category = urlParams.get('category') || '';
    window.currentFilters.sort = urlParams.get('sort') || 'created_at_desc';
    window.currentFilters.page = parseInt(urlParams.get('page')) || 1;
    window.currentFilters.page_size = parseInt(urlParams.get('page_size')) || 10;

    // 设置筛选器值
    document.getElementById('search-input').value = window.currentFilters.search;
    document.getElementById('search-type-filter').value = window.currentFilters.search_type;
    document.getElementById('search-fields-filter').value = window.currentFilters.search_fields;
    document.getElementById('category-filter').value = window.currentFilters.category;
    document.getElementById('sort-filter').value = window.currentFilters.sort;
    document.getElementById('page-size-select').value = window.currentFilters.page_size.toString();
  }

  // 加载文章列表
  window.loadArticlesList = async function (resetPage = false) {
    if (window.articlesIsLoading) return;

    if (resetPage) {
      window.currentFilters.page = 1;
    }

    const articlesContainer = document.getElementById('articles-container');
    const articlesLoading = document.getElementById('articles-loading');
    const articlesList = document.getElementById('articles-list');
    const articlesEmpty = document.getElementById('articles-empty');
    const articlesError = document.getElementById('articles-error');
    const paginationNav = document.getElementById('pagination-nav');

    try {
      window.articlesIsLoading = true;

      // 显示加载状态
      articlesLoading.classList.remove('d-none');
      articlesList.classList.add('d-none');
      articlesEmpty.classList.add('d-none');
      articlesError.classList.add('d-none');
      paginationNav.classList.add('d-none');

      // 更新状态
      window.appState.setArticlesLoading(true);

      // 调用API获取文章列表
      const response = await window.apiClient.articles.getList(window.currentFilters);

      // 隐藏加载状态
      articlesLoading.classList.add('d-none');

      if (response && response.articles && Array.isArray(response.articles) && response.articles.length > 0) {
        // 渲染文章列表
        renderArticlesList(response.articles);

        // 更新分页
        if (response.pagination) {
          updatePagination(response.pagination);
          paginationNav.classList.remove('d-none');
        }

        // 更新文章数量显示
        updateArticlesCount(response.pagination?.total_count || response.articles.length);

        articlesList.classList.remove('d-none');
      } else {
        // 显示空状态
        articlesEmpty.classList.remove('d-none');
        updateArticlesCount(0);
      }

      // 更新URL参数
      updateUrlParams();

    } catch (error) {
      console.error('加载文章列表失败:', error);

      // 显示错误状态
      articlesLoading.classList.add('d-none');
      articlesError.classList.remove('d-none');
    } finally {
      window.articlesIsLoading = false;
      window.appState.setArticlesLoading(false);
    }
  };

  // 渲染文章列表
  function renderArticlesList(articles) {
    const articlesList = document.getElementById('articles-list');
    const viewMode = document.querySelector('input[name="view-mode"]:checked').value;

    if (!articlesList) return;

    const articlesHtml = articles.map(article =>
      createArticleCard(article, viewMode)
    ).join('');

    articlesList.innerHTML = articlesHtml;
    articlesList.className = viewMode === 'grid' ? 'row' : '';

    // 保存文章数据到应用状态
    window.appState.setState('articles.list', articles);

    // 重新加载标签云以显示当前页面的标签
    loadTagsCloud();
  }

  // 创建文章卡片
  function createArticleCard(article, viewMode = 'list') {
    const publishDate = formatDate(article.created_at);
    const tags = article.tags ? article.tags.split(',').filter(tag => tag.trim()) : [];

    const gridClass = viewMode === 'grid' ? 'col-md-6 mb-4' : 'mb-4';

    return `
    <div class="${gridClass}">
      <div class="article-card">
        <div class="card-body">
          <h3 class="article-title">
            <a href="/articles/${article.id}/${article.version}" class="text-decoration-none">
              ${escapeHtml(article.title)}
            </a>
          </h3>
          
          <p class="article-description">
            ${escapeHtml(article.description || '暂无描述')}
          </p>
          
          ${tags.length > 0 ? `
            <div class="article-tags">
              ${tags.map(tag => `
                <span class="article-tag" onclick="filterByTag('${escapeHtml(tag.trim())}')">
                  ${escapeHtml(tag.trim())}
                </span>
              `).join('')}
            </div>
          ` : ''}
          
          <div class="article-meta">
            <span>
              <i class="fas fa-calendar-alt me-1"></i>
              ${publishDate}
            </span>
            <span>
              <i class="fas fa-folder me-1"></i>
              ${escapeHtml(article.category || '未分类')}
            </span>
            <span>
              <i class="fas fa-eye me-1"></i>
              ${article.views || 0} 次阅读
            </span>
          </div>
        </div>
      </div>
    </div>
  `;
  }

  // 更新分页
  function updatePagination(pagination) {
    const paginationEl = document.getElementById('pagination');
    if (!paginationEl) return;

    const { current_page, page_size, total_count, total_pages } = pagination;
    const page = current_page || pagination.page || 1;
    const pageSize = page_size || pagination.pageSize || 10;
    const total = total_count || pagination.total || 0;
    const totalPages = total_pages || Math.ceil(total / pageSize);

    if (totalPages <= 1) {
      return;
    }

    let paginationHtml = '';

    // 上一页
    if (page > 1) {
      paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${page - 1})">
          <i class="fas fa-chevron-left"></i>
        </a>
      </li>
    `;
    }

    // 页码
    const startPage = Math.max(1, page - 2);
    const endPage = Math.min(totalPages, page + 2);

    if (startPage > 1) {
      paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(1)">1</a>
      </li>
    `;
      if (startPage > 2) {
        paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
    }

    for (let i = startPage; i <= endPage; i++) {
      paginationHtml += `
      <li class="page-item ${i === page ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
      </li>
    `;
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) {
        paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
      }
      paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${totalPages})">${totalPages}</a>
      </li>
    `;
    }

    // 下一页
    if (page < totalPages) {
      paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${page + 1})">
          <i class="fas fa-chevron-right"></i>
        </a>
      </li>
    `;
    }

    paginationEl.innerHTML = paginationHtml;
  }

  // 更新文章数量显示
  function updateArticlesCount(count) {
    const articlesCount = document.getElementById('articles-count');
    if (articlesCount) {
      articlesCount.textContent = `共 ${count} 篇文章`;
    }
  }

  // 更新URL参数
  function updateUrlParams() {
    const params = new URLSearchParams();

    if (window.currentFilters.search) params.set('search', window.currentFilters.search);
    if (window.currentFilters.search_type !== 'fuzzy') params.set('search_type', window.currentFilters.search_type);
    if (window.currentFilters.search_fields !== 'all') params.set('search_fields', window.currentFilters.search_fields);
    if (window.currentFilters.category) params.set('category', window.currentFilters.category);
    if (window.currentFilters.sort !== 'created_at_desc') params.set('sort', window.currentFilters.sort);
    if (window.currentFilters.page > 1) params.set('page', window.currentFilters.page.toString());
    if (window.currentFilters.page_size !== 10) params.set('page_size', window.currentFilters.page_size.toString());

    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', newUrl);
  }

  // 切换页码
  window.changePage = function (page) {
    window.currentFilters.page = page;
    loadArticlesList();

    // 滚动到顶部
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // 根据标签筛选
  window.filterByTag = function (tag) {
    window.currentFilters.search = tag;
    document.getElementById('search-input').value = tag;
    loadArticlesList(true);
  };

  // 绑定事件
  function bindArticlesEvents() {
    // 搜索输入框防抖
    let searchTimeout;
    const searchInput = document.getElementById('search-input');
    
    if (searchInput) {
      // 输入事件防抖
      searchInput.addEventListener('input', function (e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          window.currentFilters.search = e.target.value.trim();
          loadArticlesList(true);
        }, 500);
      });

      // 回车键立即搜索
      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault(); // 防止表单提交或其他默认行为
          clearTimeout(searchTimeout); // 清除防抖定时器
          window.currentFilters.search = e.target.value.trim();
          loadArticlesList(true);
        }
      });
    }

    // 搜索类型筛选
    document.getElementById('search-type-filter')?.addEventListener('change', function (e) {
      window.currentFilters.search_type = e.target.value;
      loadArticlesList(true);
    });

    // 搜索字段筛选
    document.getElementById('search-fields-filter')?.addEventListener('change', function (e) {
      window.currentFilters.search_fields = e.target.value;
      loadArticlesList(true);
    });

    // 分类筛选
    document.getElementById('category-filter')?.addEventListener('change', function (e) {
      window.currentFilters.category = e.target.value;
      loadArticlesList(true);
    });

    // 排序方式
    document.getElementById('sort-filter')?.addEventListener('change', function (e) {
      window.currentFilters.sort = e.target.value;
      loadArticlesList(true);
    });

    // 分页数量选择
    document.getElementById('page-size-select')?.addEventListener('change', function (e) {
      window.currentFilters.page_size = parseInt(e.target.value);
      window.currentFilters.page = 1; // 重置到第一页
      loadArticlesList();
    });

    // 视图切换
    document.querySelectorAll('input[name="view-mode"]').forEach(radio => {
      radio.addEventListener('change', function () {
        const articles = window.appState.getState('articles.list');
        if (articles && articles.length > 0) {
          renderArticlesList(articles);
        }
      });
    });

    // 订阅按钮
    document.getElementById('subscribe-updates-btn')?.addEventListener('click', function () {
      window.blogApp.showNotification('订阅功能即将上线', 'info');
    });
  }

  // 加载侧边栏数据
  async function loadSidebarData() {
    // 加载热门文章
    loadPopularArticles();

    // 加载标签云
    loadTagsCloud();
  }

  // 加载热门文章
  async function loadPopularArticles() {
    const popularArticles = document.getElementById('popular-articles');

    try {
      // 调用热门文章API
      const response = await window.apiClient.articles.getHot();

      if (response.articles && response.articles.length > 0) {
        // 显示文章列表
        const articlesHtml = response.articles.map(article => `
          <div class="popular-article-item mb-2">
            <a href="/articles/${article.id}/${article.version}" class="text-decoration-none">
              <h6 class="mb-1 text-truncate">${escapeHtml(article.title)}</h6>
              <small class="text-muted">${formatDate(article.created_at)}</small>
            </a>
          </div>
        `).join('');

        popularArticles.innerHTML = articlesHtml;
      } else {
        popularArticles.innerHTML = '<p class="text-muted small">暂无文章</p>';
      }

    } catch (error) {
      console.error('加载热门文章失败:', error);
      popularArticles.innerHTML = '<p class="text-muted small">加载失败</p>';
    }
  }

  // 加载标签云（从当前页面所有文章提取标签）
  async function loadTagsCloud() {
    const tagsCloud = document.getElementById('tags-cloud');

    try {
      // 获取当前页面的文章数据
      const currentArticles = window.appState.getState('articles.list') || [];

      if (currentArticles.length > 0) {
        // 提取当前页面所有文章的标签
        const allTags = [];
        currentArticles.forEach(article => {
          if (article.tags) {
            const tags = article.tags.split(',').filter(tag => tag.trim());
            tags.forEach(tag => {
              const trimmedTag = tag.trim();
              if (trimmedTag && !allTags.includes(trimmedTag)) {
                allTags.push(trimmedTag);
              }
            });
          }
        });

        // 显示标签
        if (allTags.length > 0) {
          tagsCloud.innerHTML = `
            <div class="d-flex flex-wrap gap-2">
              ${allTags.map(tag => `
                <span class="article-tag" onclick="filterByTag('${escapeHtml(tag)}')" style="cursor: pointer;">
                  ${escapeHtml(tag)}
                </span>
              `).join('')}
            </div>
          `;
        } else {
          tagsCloud.innerHTML = '<p class="text-muted small">当前页面暂无标签</p>';
        }
      } else {
        tagsCloud.innerHTML = '<p class="text-muted small">当前页面暂无文章</p>';
      }

    } catch (error) {
      console.error('加载标签云失败:', error);
      tagsCloud.innerHTML = '<p class="text-muted small">加载失败</p>';
    }
  }

  // HTML转义函数
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 格式化日期函数
  function formatDate(dateInput) {
    // 处理不同的日期输入格式
    let date;
    if (typeof dateInput === 'string') {
      // ISO 8601 字符串格式 (Go time.Time 默认序列化格式)
      date = new Date(dateInput);
    } else if (typeof dateInput === 'number') {
      // 时间戳格式，判断是秒还是毫秒
      if (dateInput < 10000000000) {
        // 秒级时间戳
        date = new Date(dateInput * 1000);
      } else {
        // 毫秒级时间戳
        date = new Date(dateInput);
      }
    } else {
      date = new Date(dateInput);
    }

    const now = new Date();
    const diffTime = Math.abs(now - date);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays === 0) {
      return '今天';
    } else if (diffDays === 1) {
      return '昨天';
    } else if (diffDays < 7) {
      return `${diffDays}天前`;
    } else {
      return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }
  }
</script>
