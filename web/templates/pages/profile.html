<div class="container-wide py-4">
  <div class="row">
    <!-- 用户信息卡片 -->
    <div class="col-lg-4 mb-4">
      <div class="card-custom">
        <div class="card-body text-center">
          <div class="mb-3">
            <img id="profile-avatar" src="/assets/images/default-avatar.svg" alt="用户头像" class="avatar avatar-lg mb-3">
            <div>
              <button class="btn btn-outline-custom btn-sm" id="change-avatar-btn">
                <i class="fas fa-camera me-2"></i>更换头像
              </button>
              <input type="file" id="avatar-input" class="d-none" accept="image/*">
            </div>
          </div>

          <h4 id="profile-username" class="mb-1">-</h4>
          <p id="profile-role" class="text-muted mb-3">-</p>

        </div>
      </div>

      <!-- 快捷操作 -->
      <div class="card-custom mt-4">
        <div class="card-body">
          <h6 class="card-title">
            <i class="fas fa-bolt me-2"></i>
            快捷操作
          </h6>
          <div class="d-grid gap-2">
            <a href="/admin/articles/new" class="btn btn-primary-custom btn-sm d-none" id="write-article-btn">
              <i class="fas fa-pen me-2"></i>写新文章
            </a>
            <a href="/admin" class="btn btn-secondary-custom btn-sm d-none" id="admin-panel-btn">
              <i class="fas fa-cog me-2"></i>管理后台
            </a>
            <button class="btn btn-outline-custom btn-sm" id="export-data-btn">
              <i class="fas fa-download me-2"></i>导出数据
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 主内容区域 -->
    <div class="col-lg-8">
      <!-- 标签页导航 -->
      <ul class="nav nav-pills-custom mb-4" id="profile-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="info-tab" data-bs-toggle="pill" data-bs-target="#info-panel" type="button"
            role="tab">
            <i class="fas fa-user me-2"></i>基本信息
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="security-tab" data-bs-toggle="pill" data-bs-target="#security-panel"
            type="button" role="tab">
            <i class="fas fa-shield-alt me-2"></i>安全设置
          </button>
        </li>
      </ul>

      <!-- 标签页内容 -->
      <div class="tab-content" id="profile-tab-content">
        <!-- 基本信息面板 -->
        <div class="tab-pane fade show active" id="info-panel" role="tabpanel">
          <div class="card-custom">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="card-title mb-0">
                  <i class="fas fa-user-edit me-2"></i>
                  个人信息
                </h5>
                <button class="btn btn-outline-custom btn-sm" id="edit-info-btn">
                  <i class="fas fa-edit me-2"></i>编辑
                </button>
              </div>

              <form id="profile-info-form">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="nickname" class="form-label-custom">昵称</label>
                    <input type="text" class="form-control form-control-custom" id="nickname" name="nickname" readonly>
                    <div class="invalid-feedback" id="nickname-error"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="email" class="form-label-custom">邮箱地址</label>
                    <input type="email" class="form-control form-control-custom" id="email" name="email" readonly>
                    <div class="invalid-feedback" id="email-error"></div>
                  </div>

                  <div class="col-12 mb-3">
                    <label for="bio" class="form-label-custom">个人简介</label>
                    <textarea class="form-control form-control-custom" id="bio" name="bio" rows="4" readonly
                      placeholder="介绍一下自己吧..."></textarea>
                    <div class="invalid-feedback" id="bio-error"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="website" class="form-label-custom">个人网站</label>
                    <input type="url" class="form-control form-control-custom" id="website" name="website" readonly
                      placeholder="https://...">
                    <div class="invalid-feedback" id="website-error"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="location" class="form-label-custom">所在地区</label>
                    <input type="text" class="form-control form-control-custom" id="location" name="location" readonly
                      placeholder="如：北京市">
                    <div class="invalid-feedback" id="location-error"></div>
                  </div>
                </div>

                <div class="d-none" id="info-form-actions">
                  <button type="submit" class="btn btn-primary-custom me-2" id="save-info-btn">
                    <span class="btn-text">保存更改</span>
                    <span class="spinner-border spinner-border-sm d-none" id="save-info-spinner"></span>
                  </button>
                  <button type="button" class="btn btn-secondary-custom" id="cancel-edit-btn">取消</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- 安全设置面板 -->
        <div class="tab-pane fade" id="security-panel" role="tabpanel">
          <div class="card-custom">
            <div class="card-body">
              <h5 class="card-title">
                <i class="fas fa-key me-2"></i>
                修改密码
              </h5>

              <form id="change-password-form">
                <div class="mb-3">
                  <label for="current-password" class="form-label-custom">当前密码</label>
                  <input type="password" class="form-control form-control-custom" id="current-password"
                    name="currentPassword" required>
                  <div class="invalid-feedback" id="current-password-error"></div>
                </div>

                <div class="mb-3">
                  <label for="new-password" class="form-label-custom">新密码</label>
                  <input type="password" class="form-control form-control-custom" id="new-password" name="newPassword"
                    required>
                  <div class="form-text">至少6个字符，建议包含字母和数字</div>
                  <div class="invalid-feedback" id="new-password-error"></div>
                </div>

                <div class="mb-3">
                  <label for="confirm-new-password" class="form-label-custom">确认新密码</label>
                  <input type="password" class="form-control form-control-custom" id="confirm-new-password"
                    name="confirmPassword" required>
                  <div class="invalid-feedback" id="confirm-new-password-error"></div>
                </div>

                <button type="submit" class="btn btn-primary-custom" id="change-password-btn">
                  <span class="btn-text">修改密码</span>
                  <span class="spinner-border spinner-border-sm d-none" id="change-password-spinner"></span>
                </button>
              </form>
            </div>
          </div>

          <!-- 账户安全 -->
          <div class="card-custom mt-4">
            <div class="card-body">
              <h5 class="card-title">
                <i class="fas fa-shield-alt me-2"></i>
                账户安全
              </h5>

              <div class="list-group list-group-flush">
                <div class="list-group-item d-flex justify-content-between align-items-center px-0">
                  <div>
                    <h6 class="mb-1">登录会话</h6>
                    <small class="text-muted">管理您的登录会话</small>
                  </div>
                  <button class="btn btn-outline-custom btn-sm" id="manage-sessions-btn">管理</button>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center px-0">
                  <div>
                    <h6 class="mb-1">删除账户</h6>
                    <small class="text-muted text-danger">永久删除您的账户和所有数据</small>
                  </div>
                  <button class="btn btn-outline-danger btn-sm" id="delete-account-btn">删除</button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- 头像上传模态框 -->
<div class="modal fade" id="avatar-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content modal-content-custom">
      <div class="modal-header modal-header-custom">
        <h5 class="modal-title">
          <i class="fas fa-camera me-2"></i>
          更换头像
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body modal-body-custom">
        <div class="text-center">
          <div class="mb-3">
            <img id="avatar-preview" src="" alt="头像预览" class="avatar avatar-lg">
          </div>
          <div class="mb-3">
            <label for="avatar-file" class="btn btn-outline-custom">
              <i class="fas fa-upload me-2"></i>选择图片
            </label>
            <input type="file" id="avatar-file" class="d-none" accept="image/*">
          </div>
          <p class="text-muted small">支持 JPG、PNG 格式，文件大小不超过 2MB</p>
        </div>
      </div>
      <div class="modal-footer modal-footer-custom">
        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary-custom" id="upload-avatar-btn">
          <span class="btn-text">上传头像</span>
          <span class="spinner-border spinner-border-sm d-none" id="upload-avatar-spinner"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // 个人资料页面初始化函数
  window.initProfilePage = function (routeData) {
    console.log('初始化个人资料页面');

    // 加载用户信息
    loadUserProfile();

    // 绑定事件
    bindProfileEvents();
  };

  // 加载用户信息
  async function loadUserProfile() {
    try {
      const userProfile = window.appState.getState('user.profile');
      if (!userProfile) {
        // 如果状态中没有用户信息，重新获取
        const profile = await window.apiClient.user.getProfile();
        window.appState.setUser(profile);
        displayUserProfile(profile);
      } else {
        displayUserProfile(userProfile);
      }


    } catch (error) {
      console.error('加载用户信息失败:', error);
      window.blogApp.showNotification('加载用户信息失败', 'error');
    }
  }

  // 显示用户信息
  function displayUserProfile(profile) {
    // 基本信息显示
    document.getElementById('profile-avatar').src = profile.avatar || '/assets/images/default-avatar.svg';
    document.getElementById('profile-username').textContent = profile.nickname || profile.username;
    document.getElementById('profile-role').textContent = profile.role === 'admin' ? '管理员' : '用户';

    // 表单字段填充
    document.getElementById('nickname').value = profile.nickname || '';
    document.getElementById('email').value = profile.email || '';
    document.getElementById('bio').value = profile.self_intro || '';
    document.getElementById('website').value = profile.personal_web || '';
    document.getElementById('location').value = profile.location || '';


    // 显示管理员功能
    if (profile.role === 'admin') {
      document.getElementById('write-article-btn').classList.remove('d-none');
      document.getElementById('admin-panel-btn').classList.remove('d-none');
    }
  }

  // 绑定事件
  function bindProfileEvents() {
    // 编辑基本信息
    document.getElementById('edit-info-btn')?.addEventListener('click', toggleEditMode);
    document.getElementById('cancel-edit-btn')?.addEventListener('click', cancelEditMode);
    document.getElementById('profile-info-form')?.addEventListener('submit', saveUserInfo);

    // 修改密码
    document.getElementById('change-password-form')?.addEventListener('submit', changePassword);

    // 头像相关
    document.getElementById('change-avatar-btn')?.addEventListener('click', () => {
      new bootstrap.Modal(document.getElementById('avatar-modal')).show();
    });
    document.getElementById('avatar-file')?.addEventListener('change', previewAvatar);
    document.getElementById('upload-avatar-btn')?.addEventListener('click', uploadAvatar);

    // 其他操作
    document.getElementById('manage-sessions-btn')?.addEventListener('click', manageSessions);
    document.getElementById('delete-account-btn')?.addEventListener('click', deleteAccount);
    document.getElementById('export-data-btn')?.addEventListener('click', exportUserData);
  }

  // 切换编辑模式
  function toggleEditMode() {
    const form = document.getElementById('profile-info-form');
    const inputs = form.querySelectorAll('input, textarea');
    const editBtn = document.getElementById('edit-info-btn');
    const actions = document.getElementById('info-form-actions');

    inputs.forEach(input => input.removeAttribute('readonly'));
    editBtn.classList.add('d-none');
    actions.classList.remove('d-none');
  }

  // 取消编辑模式
  function cancelEditMode() {
    const form = document.getElementById('profile-info-form');
    const inputs = form.querySelectorAll('input, textarea');
    const editBtn = document.getElementById('edit-info-btn');
    const actions = document.getElementById('info-form-actions');

    inputs.forEach(input => input.setAttribute('readonly', 'readonly'));
    editBtn.classList.remove('d-none');
    actions.classList.add('d-none');

    // 恢复原始值
    const userProfile = window.appState.getState('user.profile');
    if (userProfile) {
      displayUserProfile(userProfile);
    }
  }

  // 保存用户信息
  async function saveUserInfo(e) {
    e.preventDefault();

    const saveBtn = document.getElementById('save-info-btn');
    const spinner = document.getElementById('save-info-spinner');

    try {
      // 设置加载状态
      saveBtn.disabled = true;
      saveBtn.querySelector('.btn-text').textContent = '保存中...';
      spinner.classList.remove('d-none');

      const formData = new FormData(e.target);
      const profileData = {
        nickname: formData.get('nickname'),
        email: formData.get('email'),
        self_intro: formData.get('bio'),
        personal_web: formData.get('website'),
        location: formData.get('location')
      };

      // 调用更新API
      await window.apiClient.user.updateProfile(profileData);

      // 更新本地状态
      const currentProfile = window.appState.getState('user.profile');
      window.appState.setState('user.profile', { ...currentProfile, ...profileData });

      window.blogApp.showNotification('个人信息更新成功', 'success');
      cancelEditMode();

    } catch (error) {
      console.error('保存用户信息失败:', error);
      window.blogApp.showNotification(error.message || '保存失败，请重试', 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.querySelector('.btn-text').textContent = '保存更改';
      spinner.classList.add('d-none');
    }
  }

  // 修改密码
  async function changePassword(e) {
    e.preventDefault();

    const changeBtn = document.getElementById('change-password-btn');
    const spinner = document.getElementById('change-password-spinner');

    try {
      changeBtn.disabled = true;
      changeBtn.querySelector('.btn-text').textContent = '修改中...';
      spinner.classList.remove('d-none');

      const formData = new FormData(e.target);
      const passwordData = {
        oldPassword: formData.get('currentPassword'),
        newPassword: formData.get('newPassword'),
        confirmPassword: formData.get('confirmPassword')
      };

      // 验证新密码
      if (passwordData.newPassword !== passwordData.confirmPassword) {
        throw new Error('两次输入的新密码不一致');
      }

      await window.apiClient.user.updatePassword(passwordData);

      window.blogApp.showNotification('密码修改成功', 'success');
      document.getElementById('change-password-form').reset();

    } catch (error) {
      console.error('修改密码失败:', error);
      window.blogApp.showNotification(error.message || '修改密码失败，请重试', 'error');
    } finally {
      changeBtn.disabled = false;
      changeBtn.querySelector('.btn-text').textContent = '修改密码';
      spinner.classList.add('d-none');
    }
  }

  // 预览头像
  function previewAvatar(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('avatar-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  // 上传头像
  async function uploadAvatar() {
    const fileInput = document.getElementById('avatar-file');
    const file = fileInput.files[0];

    if (!file) {
      window.blogApp.showNotification('请选择头像文件', 'warning');
      return;
    }

    const uploadBtn = document.getElementById('upload-avatar-btn');
    const spinner = document.getElementById('upload-avatar-spinner');

    try {
      uploadBtn.disabled = true;
      uploadBtn.querySelector('.btn-text').textContent = '上传中...';
      spinner.classList.remove('d-none');

      // 上传文件
      const uploadResult = await window.apiClient.files.upload(file);

      // 更新用户头像
      const avatarUrl = window.apiClient.files.getDownloadUrl(uploadResult.file_id);
      console.log('avatarUrl', avatarUrl);
      await window.apiClient.user.updateProfile({ avatar: avatarUrl });

      // 更新页面显示
      document.getElementById('profile-avatar').src = avatarUrl;
      document.getElementById('nav-avatar').src = avatarUrl;

      // 更新状态
      const currentProfile = window.appState.getState('user.profile');
      window.appState.setState('user.profile', { ...currentProfile, avatar: avatarUrl });

      window.blogApp.showNotification('头像更新成功', 'success');
      bootstrap.Modal.getInstance(document.getElementById('avatar-modal')).hide();

    } catch (error) {
      console.error('上传头像失败:', error);
      window.blogApp.showNotification(error.message || '上传头像失败，请重试', 'error');
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.querySelector('.btn-text').textContent = '上传头像';
      spinner.classList.add('d-none');
    }
  }


  // 管理会话
  function manageSessions() {
    window.blogApp.showNotification('会话管理功能即将上线', 'info');
  }

  // 删除账户
  async function deleteAccount() {
    // 二次确认
    if (!confirm('确定要删除账户吗？此操作不可恢复！')) {
      return;
    }
    
    if (!confirm('删除账户将永久清除您的所有数据，包括文章、评论等。确认继续？')) {
      return;
    }

    const deleteBtn = document.getElementById('delete-account-btn');
    const originalText = deleteBtn.textContent;
    
    try {
      // 显示加载状态
      deleteBtn.disabled = true;
      deleteBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>删除中...';
      
      // 调用删除账户API
      await window.apiClient.user.deleteAccount();
      
      // 删除成功
      window.blogApp.showNotification('账户删除成功', 'success');
      
      // 清除用户状态
      window.appState.clearUser();
      
      // 延迟跳转到首页
      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
      
    } catch (error) {
      console.error('删除账户失败:', error);
      
      let errorMessage = '删除账户失败';
      if (error.message) {
        errorMessage += ': ' + error.message;
      }
      
      window.blogApp.showNotification(errorMessage, 'error');
      
      // 恢复按钮状态
      deleteBtn.disabled = false;
      deleteBtn.textContent = originalText;
    }
  }

  // 导出用户数据
  function exportUserData() {
    window.blogApp.showNotification('数据导出功能即将上线', 'info');
  }
</script>
