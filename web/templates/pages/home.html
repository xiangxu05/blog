<div class="container-wide py-4">
  <!-- 欢迎横幅 -->
  <div class="row mb-5">
    <div class="col-12">
      <div class="card-custom bg-gradient p-4 p-md-5 text-center hero-banner">
        <div class="row align-items-center">
          <div class="col-md-8 mx-auto">
            <h1 class="display-4 fw-bold text-white mb-3">
              <i class="fas fa-feather-alt me-3"></i>
              你好，我是项许
            </h1>
            <p class="lead text-white-50 mb-4">
              分享技术见解，记录成长历程，与世界分享我的思考
            </p>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
              <a href="/articles" class="btn btn-light btn-lg">
                <i class="fas fa-book-open me-2"></i>
                浏览文章
              </a>
              <button class="btn btn-outline-light btn-lg" id="subscribe-btn">
                <i class="fas fa-bell me-2"></i>
                订阅更新
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- 主内容区域 -->
    <div class="col-lg-8">
      <!-- 最新文章标题 -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">
          <i class="fas fa-newspaper me-2 text-primary"></i>
          最新文章
        </h2>
        <a href="/articles" class="btn btn-outline-custom">
          查看全部
          <i class="fas fa-arrow-right ms-2"></i>
        </a>
      </div>

      <!-- 文章列表 -->
      <div id="articles-container">
        <!-- 加载状态 -->
        <div id="articles-loading" class="text-center py-5">
          <div class="spinner-border text-primary mb-3" role="status">
            <span class="visually-hidden">加载中...</span>
          </div>
          <p class="text-muted">正在加载文章...</p>
        </div>

        <!-- 文章列表将通过JavaScript动态填充 -->
        <div id="articles-list" class="d-none">
          <!-- 文章卡片模板将在这里渲染 -->
        </div>

        <!-- 空状态 -->
        <div id="articles-empty" class="text-center py-5 d-none">
          <i class="fas fa-file-alt fa-3x text-muted mb-3"></i>
          <h4 class="text-muted">暂无文章</h4>
          <p class="text-muted">作者还没有发布任何文章</p>
        </div>

        <!-- 错误状态 -->
        <div id="articles-error" class="alert alert-danger-custom d-none">
          <i class="fas fa-exclamation-triangle me-2"></i>
          <strong>加载失败</strong>
          <p class="mb-2">无法加载文章列表，请稍后重试</p>
          <button class="btn btn-outline-danger btn-sm" onclick="window.loadHomeArticles()">
            <i class="fas fa-refresh me-2"></i>重新加载
          </button>
        </div>
      </div>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
      <!-- 关于博主 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-user-circle me-2"></i>
            关于博主
          </h5>
          <div class="text-center mb-3">
            <img id="blogger-avatar" src="/assets/images/default-avatar.svg" alt="博主头像" class="avatar avatar-lg">
          </div>
          <p id="blogger-intro" class="text-muted small text-center">
            热爱技术，喜欢分享。专注于前端开发、后端架构和技术教学。
          </p>
          <div id="blogger-location" class="text-center mb-3" style="display: none;">
            <small class="text-muted">
              <i class="fas fa-map-marker-alt me-1"></i>
              <span id="blogger-location-text"></span>
            </small>
          </div>
          <div class="d-flex justify-content-center gap-2">
            <a id="blogger-github" href="#" class="btn btn-outline-custom btn-sm">
              <i class="fab fa-github"></i>
            </a>
            <a id="blogger-twitter" href="#" class="btn btn-outline-custom btn-sm">
              <i class="fab fa-twitter"></i>
            </a>
            <a id="blogger-email" href="#" class="btn btn-outline-custom btn-sm">
              <i class="fas fa-envelope"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- 热门标签 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-tags me-2"></i>
            标签云
          </h5>
          <div id="popular-tags">
            <!-- 标签将通过JavaScript动态加载 -->
            <div class="d-flex flex-wrap gap-2">
              <span class="article-tag">JavaScript</span>
              <span class="article-tag">Vue.js</span>
              <span class="article-tag">Node.js</span>
              <span class="article-tag">Python</span>
              <span class="article-tag">Go</span>
              <span class="article-tag">数据库</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 统计信息 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-chart-bar me-2"></i>
            网站统计
          </h5>
          <div class="row text-center">
            <div class="col-4">
              <div class="border-end">
                <h4 class="text-primary mb-0" id="total-articles">-</h4>
                <small class="text-muted">文章</small>
              </div>
            </div>
            <div class="col-4">
              <div class="border-end">
                <h4 class="text-success mb-0" id="total-views">-</h4>
                <small class="text-muted">浏览</small>
              </div>
            </div>
            <div class="col-4">
              <h4 class="text-warning mb-0" id="total-tags">-</h4>
              <small class="text-muted">分类</small>
            </div>
          </div>
        </div>
      </div>

      <!-- 最近更新 -->
      <div class="card-custom">
        <div class="card-body">
          <h5 class="card-title">
            <i class="fas fa-clock me-2"></i>
            最近更新
          </h5>
          <div id="recent-updates">
            <p class="text-muted small">正在加载...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 首页初始化函数
  window.initHomePage = function (routeData) {
    console.log('===== 初始化首页 =====');
    console.log('routeData:', routeData);
    console.log('window.apiClient 是否存在:', !!window.apiClient);
    console.log('window.apiClient.articles 是否存在:', !!window.apiClient?.articles);

    // 加载首页数据
    loadHomeData();

    // 绑定事件
    bindHomeEvents();
  };

  // 加载首页数据
  async function loadHomeData() {
    // 并行加载各种数据
    await Promise.all([
      loadHomeArticles(),
      loadSiteStats(),
      loadRecentUpdates(),
      loadBloggerInfo(),
      loadPopularTags()
    ]);
  }

  // 加载博主信息
  async function loadBloggerInfo() {
    try {
      // 获取管理员（1号ID）用户信息
      const response = await window.apiClient.user.getUserInfo(1);

      if (response) {
        const user = response;

        // 更新博主头像
        const avatar = document.getElementById('blogger-avatar');
        if (avatar) {
          avatar.src = user.avatar || '/assets/images/default-avatar.svg';
        }

        // 更新博主介绍
        const intro = document.getElementById('blogger-intro');
        if (intro && user.self_intro) {
          intro.textContent = user.self_intro;
        }

        // 更新个人网站链接（使用GitHub按钮）
        const github = document.getElementById('blogger-github');
        if (github && user.personal_web) {
          github.href = user.personal_web;
          github.style.display = 'inline-block';
        } else if (github) {
          github.style.display = 'none';
        }

        // 隐藏Twitter链接（暂时没有对应字段）
        const twitter = document.getElementById('blogger-twitter');
        if (twitter) {
          twitter.style.display = 'none';
        }

        // 更新邮箱链接
        const email = document.getElementById('blogger-email');
        if (email && user.email) {
          email.href = `mailto:${user.email}`;
          email.style.display = 'inline-block';
        } else if (email) {
          email.style.display = 'none';
        }

        // 更新位置信息
        const locationDiv = document.getElementById('blogger-location');
        const locationText = document.getElementById('blogger-location-text');
        if (locationDiv && locationText && user.location) {
          locationText.textContent = user.location;
          locationDiv.style.display = 'block';
        } else if (locationDiv) {
          locationDiv.style.display = 'none';
        }
      }
    } catch (error) {
      console.error('加载博主信息失败:', error);
    }
  }

  // 加载首页文章列表
  window.loadHomeArticles = async function () {
    console.log('===== 开始加载首页文章 =====');
    const articlesContainer = document.getElementById('articles-container');
    const articlesLoading = document.getElementById('articles-loading');
    const articlesList = document.getElementById('articles-list');
    const articlesEmpty = document.getElementById('articles-empty');
    const articlesError = document.getElementById('articles-error');

    console.log('页面元素检查:', {
      articlesContainer: !!articlesContainer,
      articlesLoading: !!articlesLoading,
      articlesList: !!articlesList,
      articlesEmpty: !!articlesEmpty,
      articlesError: !!articlesError
    });

    // 确保元素存在
    if (!articlesLoading || !articlesList || !articlesEmpty || !articlesError) {
      console.error('页面元素不存在');
      return;
    }

    // 确保API客户端已初始化
    if (!window.apiClient || !window.apiClient.articles) {
      console.error('API客户端未初始化', {
        apiClient: !!window.apiClient,
        articles: !!window.apiClient?.articles
      });
      articlesLoading.classList.add('d-none');
      articlesError.classList.remove('d-none');
      return;
    }

    try {
      // 显示加载状态
      articlesLoading.classList.remove('d-none');
      articlesList.classList.add('d-none');
      articlesEmpty.classList.add('d-none');
      articlesError.classList.add('d-none');

      // 获取文章列表（首页只显示最新4篇）
      const params = { page: 1, page_size: 4 };
      console.log('请求参数:', params);
      const response = await window.apiClient.articles.getList(params);
      console.log('API 响应:', response);

      // 隐藏加载状态
      articlesLoading.classList.add('d-none');

      // 检查响应数据
      if (response && response.articles && Array.isArray(response.articles) && response.articles.length > 0) {
        console.log('文章数量:', response.articles.length);
        // 渲染文章列表
        renderArticlesList(response.articles);
        articlesList.classList.remove('d-none');
      } else {
        console.log('无文章数据');
        // 显示空状态
        articlesEmpty.classList.remove('d-none');
      }

    } catch (error) {
      console.error('===== 加载首页文章失败 =====');
      console.error('错误:', error);
      console.error('错误详情:', error.message, error.stack);

      // 显示错误状态
      articlesLoading.classList.add('d-none');
      articlesError.classList.remove('d-none');
    }
  };

  // 渲染文章列表
  function renderArticlesList(articles) {
    const articlesList = document.getElementById('articles-list');
    if (!articlesList) return;

    const articlesHtml = articles.map(article => createArticleCard(article)).join('');
    articlesList.innerHTML = articlesHtml;
  }

  // 创建文章卡片HTML
  function createArticleCard(article) {
    // 处理时间格式：如果是字符串则直接转换，如果是数字则乘以1000
    const createdAt = typeof article.created_at === 'string' ? new Date(article.created_at) : new Date(article.created_at * 1000);
    const publishDate = createdAt.toLocaleDateString('zh-CN');
    const tags = article.tags ? article.tags.split(',').filter(tag => tag.trim()) : [];

    return `
    <div class="article-card mb-4">
      <div class="card-body">
        <h3 class="article-title">
          <a href="/articles/${article.id}/${article.version}" class="text-decoration-none">
            ${escapeHtml(article.title)}
          </a>
        </h3>
        
        <p class="article-description">
          ${escapeHtml(article.description || '暂无描述')}
        </p>
        
        ${tags.length > 0 ? `
          <div class="article-tags">
            ${tags.map(tag => `<span class="article-tag">${escapeHtml(tag.trim())}</span>`).join('')}
          </div>
        ` : ''}
        
        <div class="article-meta">
          <span>
            <i class="fas fa-calendar-alt me-1"></i>
            ${publishDate}
          </span>
          <span>
            <i class="fas fa-folder me-1"></i>
            ${escapeHtml(article.category || '未分类')}
          </span>
        </div>
      </div>
    </div>
  `;
  }

  // 加载网站统计信息
  async function loadSiteStats() {
    try {
      const response = await fetch('/api/website_statistics');
      if (response.ok) {
        const result = await response.json();
        console.log('网站统计数据:', result); // 调试用，查看实际返回的数据结构

        // 数据在 result.data 中
        const data = result.data || {};

        // 更新文章数量
        document.getElementById('total-articles').textContent = data.article_num || '0';

        // 更新浏览量，格式化大数字
        const views = data.views || 0;
        const formattedViews = views > 1000 ? (views / 1000).toFixed(1) + 'k' : views.toString();
        document.getElementById('total-views').textContent = formattedViews;

        // 更新分类数量
        document.getElementById('total-tags').textContent = data.categories || '0';
      } else {
        // 如果API调用失败，显示默认值
        document.getElementById('total-articles').textContent = '-';
        document.getElementById('total-views').textContent = '-';
        document.getElementById('total-tags').textContent = '-';
      }
    } catch (error) {
      console.error('加载统计信息失败:', error);
      // 显示错误状态
      document.getElementById('total-articles').textContent = '-';
      document.getElementById('total-views').textContent = '-';
      document.getElementById('total-tags').textContent = '-';
    }
  }

  // 加载热门标签
  async function loadPopularTags() {
    const popularTagsContainer = document.getElementById('popular-tags');
    if (!popularTagsContainer) return;

    try {
      // 获取最新文章列表来提取标签
      const response = await window.apiClient.articles.getList({
        page: 1,
        page_size: 10,
        sort: 'created_at_desc'
      });

      if (response.articles && response.articles.length > 0) {
        // 提取所有标签
        const allTags = new Set();
        response.articles.forEach(article => {
          if (article.tags) {
            const tags = article.tags.split(',').filter(tag => tag.trim());
            tags.forEach(tag => allTags.add(tag.trim()));
          }
        });

        // 转换为数组并限制数量
        const tagsArray = Array.from(allTags).slice(0, 6);

        if (tagsArray.length > 0) {
          const tagsHtml = tagsArray.map(tag =>
            `<span class="article-tag">${escapeHtml(tag)}</span>`
          ).join('');

          popularTagsContainer.innerHTML = `
            <div class="d-flex flex-wrap gap-2">
              ${tagsHtml}
            </div>
          `;
        } else {
          popularTagsContainer.innerHTML = `
            <div class="d-flex flex-wrap gap-2">
              <span class="text-muted small">暂无标签</span>
            </div>
          `;
        }
      } else {
        popularTagsContainer.innerHTML = `
          <div class="d-flex flex-wrap gap-2">
            <span class="text-muted small">暂无文章</span>
          </div>
        `;
      }
    } catch (error) {
      console.error('加载热门标签失败:', error);
      popularTagsContainer.innerHTML = `
        <div class="d-flex flex-wrap gap-2">
          <span class="text-muted small">加载失败</span>
        </div>
      `;
    }
  }

  // 加载最近更新
  async function loadRecentUpdates() {
    const recentUpdates = document.getElementById('recent-updates');
    if (!recentUpdates) return;

    try {
      const response = await fetch('/api/website_statistics');
      if (response.ok) {
        const result = await response.json();

        // 数据在 result.data 中
        const data = result.data || {};

        // 格式化时间函数
        function formatTimeAgo(dateString) {
          if (!dateString) return '未知';

          try {
            // Go的time.Time序列化为RFC3339格式，JavaScript可以直接解析
            const date = new Date(dateString);

            // 检查日期是否有效
            if (isNaN(date.getTime())) {
              return '未知';
            }

            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffMs < 0) {
              return '刚刚'; // 处理未来时间的情况
            }

            if (diffDays === 0) {
              const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
              if (diffHours === 0) {
                const diffMinutes = Math.floor(diffMs / (1000 * 60));
                return diffMinutes <= 1 ? '刚刚' : `${diffMinutes}分钟前`;
              }
              return `${diffHours}小时前`;
            } else if (diffDays === 1) {
              return '昨天';
            } else if (diffDays < 7) {
              return `${diffDays}天前`;
            } else if (diffDays < 30) {
              const weeks = Math.floor(diffDays / 7);
              return `${weeks}周前`;
            } else {
              const months = Math.floor(diffDays / 30);
              return `${months}个月前`;
            }
          } catch (error) {
            console.error('时间解析错误:', error, '原始值:', dateString);
            return '未知';
          }
        }

        console.log('最后更新时间:', data.last_update);
        console.log('最后登录时间:', data.last_login);

        const lastUpdateTime = data.last_update ? formatTimeAgo(data.last_update) : '未知';
        const lastLoginTime = data.last_login ? formatTimeAgo(data.last_login) : '未知';

        recentUpdates.innerHTML = `
        <div class="small">
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">最后更新</span>
            <span class="text-muted">${lastUpdateTime}</span>
          </div>
          <div class="d-flex justify-content-between">
            <span class="text-muted">最后登录</span>
            <span class="text-muted">${lastLoginTime}</span>
          </div>
        </div>
      `;
      } else {
        recentUpdates.innerHTML = '<p class="text-muted small">加载失败</p>';
      }
    } catch (error) {
      console.error('加载最近更新失败:', error);
      recentUpdates.innerHTML = '<p class="text-muted small">加载失败</p>';
    }
  }

  // 绑定首页事件
  function bindHomeEvents() {
    // 订阅按钮
    const subscribeBtn = document.getElementById('subscribe-btn');
    if (subscribeBtn) {
      subscribeBtn.addEventListener('click', function () {
        window.blogApp.showNotification('订阅功能即将上线', 'info');
      });
    }
  }

  // HTML转义函数
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
