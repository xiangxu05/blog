<div class="container-wide py-4">
  <!-- 页面头部 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1" id="page-title">
        <i class="fas fa-edit me-2 text-primary"></i>
        <span id="editor-title">新建文章</span>
      </h1>
      <p class="text-muted mb-0">使用 Markdown 语法编写文章</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-custom" id="save-draft-btn">
        <i class="fas fa-save me-2"></i>保存草稿
      </button>
      <button class="btn btn-success-custom" id="publish-btn">
        <i class="fas fa-paper-plane me-2"></i>发布文章
      </button>
      <a href="/admin/articles" class="btn btn-secondary-custom">
        <i class="fas fa-arrow-left me-2"></i>返回列表
      </a>
    </div>
  </div>

  <div class="row">
    <!-- 编辑器部分 -->
    <div class="col-lg-8">
      <!-- 文章基本信息 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <div class="mb-3">
            <label for="article-title" class="form-label">文章标题 *</label>
            <input type="text" class="form-control-custom" id="article-title" 
                   placeholder="请输入文章标题" maxlength="100" required>
            <div class="form-text">标题长度不超过100个字符</div>
          </div>
          
          <div class="mb-3">
            <label for="article-description" class="form-label">文章摘要</label>
            <textarea class="form-control-custom" id="article-description" rows="3" 
                      placeholder="请输入文章摘要（可选）" maxlength="200"></textarea>
            <div class="form-text">摘要长度不超过200个字符</div>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <label for="article-category" class="form-label">分类</label>
              <select class="form-select-custom" id="article-category">
                <option value="">选择分类</option>
                <option value="tech">技术博客</option>
                <option value="life">生活随笔</option>
                <option value="study">学习笔记</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="article-tags" class="form-label">标签</label>
              <input type="text" class="form-control-custom" id="article-tags" 
                     placeholder="输入标签，用逗号分隔">
            </div>
          </div>
        </div>
      </div>

      <!-- Markdown 编辑器 -->
      <div class="card-custom">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h6 class="mb-0">
            <i class="fab fa-markdown me-2"></i>
            文章内容
          </h6>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-custom" id="toggle-preview-btn" title="切换预览">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-outline-custom" id="fullscreen-btn" title="全屏编辑">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="editor-container" id="editor-container">
            <!-- 编辑区 -->
            <div class="editor-pane" id="editor-pane">
              <textarea class="form-control editor-textarea" id="markdown-editor" 
                        placeholder="请输入 Markdown 内容..."></textarea>
            </div>
            
            <!-- 预览区 -->
            <div class="preview-pane d-none" id="preview-pane">
              <div class="preview-content markdown-content" id="preview-content">
                <p class="text-muted text-center py-5">
                  <i class="fas fa-eye-slash fa-2x mb-2"></i><br>
                  开始输入内容查看预览
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
      <!-- 发布设置 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h6 class="card-title">
            <i class="fas fa-cog me-2"></i>
            发布设置
          </h6>
          
          <div class="mb-3">
            <label class="form-label">文章状态</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="article-status" 
                     id="status-draft" value="draft" checked>
              <label class="form-check-label" for="status-draft">
                草稿
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="article-status" 
                     id="status-published" value="published">
              <label class="form-check-label" for="status-published">
                发布
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="article-status" 
                     id="status-private" value="private">
              <label class="form-check-label" for="status-private">
                私有
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 图片上传 -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <h6 class="card-title">
            <i class="fas fa-image me-2"></i>
            图片上传
          </h6>
          
          <div class="upload-area" id="upload-area">
            <input type="file" id="image-upload" accept="image/*" multiple style="display: none;">
            <div class="upload-placeholder text-center py-4">
              <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
              <p class="text-muted mb-2">点击或拖拽图片到此处上传</p>
              <button class="btn btn-outline-custom btn-sm" id="select-images-btn">
                选择图片
              </button>
            </div>
          </div>
          
          <div id="uploaded-images" class="mt-3">
            <!-- 已上传的图片列表 -->
          </div>
        </div>
      </div>

      <!-- 编辑器帮助 -->
      <div class="card-custom">
        <div class="card-body">
          <h6 class="card-title">
            <i class="fas fa-question-circle me-2"></i>
            Markdown 语法
          </h6>
          <div class="markdown-help">
            <small class="text-muted">
              <div class="mb-2"><code># 标题</code> - 一级标题</div>
              <div class="mb-2"><code>## 标题</code> - 二级标题</div>
              <div class="mb-2"><code>**粗体**</code> - <strong>粗体</strong></div>
              <div class="mb-2"><code>*斜体*</code> - <em>斜体</em></div>
              <div class="mb-2"><code>[链接](url)</code> - 链接</div>
              <div class="mb-2"><code>![图片](url)</code> - 图片</div>
              <div class="mb-2"><code>```代码```</code> - 代码块</div>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// 文章编辑器页面初始化
window.initArticleEditorPage = function(routeData) {
  console.log('初始化文章编辑器页面', routeData);
  
  // 检查管理员权限
  if (!window.appState.isAdmin()) {
    window.router.push('/404');
    return;
  }
  
  // 初始化编辑器
  initArticleEditor(routeData);
};

// 编辑器状态
const editorState = {
  isEditing: false,
  articleId: null,
  isDirty: false,
  autoSaveTimer: null,
  previewMode: false
};

// 初始化编辑器
function initArticleEditor(routeData) {
  // 判断是编辑还是新建
  if (routeData.params && routeData.params.id) {
    editorState.isEditing = true;
    editorState.articleId = routeData.params.id;
    document.getElementById('editor-title').textContent = '编辑文章';
    loadArticleForEdit(routeData.params.id);
  } else {
    document.getElementById('editor-title').textContent = '新建文章';
  }
  
  bindEditorEvents();
  initMarkdownEditor();
  initImageUpload();
  startAutoSave();
}

// 绑定事件
function bindEditorEvents() {
  // 保存草稿
  document.getElementById('save-draft-btn').addEventListener('click', () => saveArticle('draft'));
  
  // 发布文章
  document.getElementById('publish-btn').addEventListener('click', () => saveArticle('published'));
  
  // 切换预览
  document.getElementById('toggle-preview-btn').addEventListener('click', togglePreview);
  
  // 全屏编辑
  document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
  
  // 选择图片
  document.getElementById('select-images-btn').addEventListener('click', () => {
    document.getElementById('image-upload').click();
  });
  
  // 监听内容变化
  document.getElementById('markdown-editor').addEventListener('input', handleContentChange);
  document.getElementById('article-title').addEventListener('input', markDirty);
  document.getElementById('article-description').addEventListener('input', markDirty);
}

// 初始化 Markdown 编辑器
function initMarkdownEditor() {
  const editor = document.getElementById('markdown-editor');
  
  // 设置样式
  editor.style.minHeight = '500px';
  editor.style.border = 'none';
  editor.style.outline = 'none';
  editor.style.resize = 'vertical';
  editor.style.fontFamily = 'Monaco, Consolas, "Courier New", monospace';
  editor.style.fontSize = '14px';
  editor.style.lineHeight = '1.6';
  editor.style.padding = '20px';
  
  // 添加快捷键支持
  editor.addEventListener('keydown', handleEditorKeydown);
}

// 处理编辑器快捷键
function handleEditorKeydown(e) {
  if (e.ctrlKey || e.metaKey) {
    switch (e.key) {
      case 's':
        e.preventDefault();
        saveArticle('draft');
        break;
      case 'Enter':
        e.preventDefault();
        saveArticle('published');
        break;
    }
  }
}

// 处理内容变化
function handleContentChange() {
  markDirty();
  
  if (editorState.previewMode) {
    updatePreview();
  }
}

// 标记为已修改
function markDirty() {
  editorState.isDirty = true;
}

// 更新预览
function updatePreview() {
  const content = document.getElementById('markdown-editor').value;
  const previewContent = document.getElementById('preview-content');
  
  if (content.trim()) {
    // 使用 marked.js 渲染 Markdown
    if (window.marked) {
      previewContent.innerHTML = window.marked.parse(content);
      // 应用代码高亮
      if (window.hljs) {
        previewContent.querySelectorAll('pre code').forEach(block => {
          window.hljs.highlightElement(block);
        });
      }
    } else {
      previewContent.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
    }
  } else {
    previewContent.innerHTML = `
      <p class="text-muted text-center py-5">
        <i class="fas fa-eye-slash fa-2x mb-2"></i><br>
        开始输入内容查看预览
      </p>
    `;
  }
}

// 切换预览模式
function togglePreview() {
  const editorPane = document.getElementById('editor-pane');
  const previewPane = document.getElementById('preview-pane');
  const toggleBtn = document.getElementById('toggle-preview-btn');
  
  editorState.previewMode = !editorState.previewMode;
  
  if (editorState.previewMode) {
    editorPane.classList.add('d-none');
    previewPane.classList.remove('d-none');
    toggleBtn.innerHTML = '<i class="fas fa-edit"></i>';
    toggleBtn.title = '返回编辑';
    updatePreview();
  } else {
    editorPane.classList.remove('d-none');
    previewPane.classList.add('d-none');
    toggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
    toggleBtn.title = '切换预览';
  }
}

// 切换全屏
function toggleFullscreen() {
  const container = document.getElementById('editor-container');
  const btn = document.getElementById('fullscreen-btn');
  
  if (!document.fullscreenElement) {
    container.requestFullscreen().then(() => {
      btn.innerHTML = '<i class="fas fa-compress"></i>';
      btn.title = '退出全屏';
    });
  } else {
    document.exitFullscreen().then(() => {
      btn.innerHTML = '<i class="fas fa-expand"></i>';
      btn.title = '全屏编辑';
    });
  }
}

// 初始化图片上传
function initImageUpload() {
  const uploadArea = document.getElementById('upload-area');
  const fileInput = document.getElementById('image-upload');
  
  // 拖拽上传
  uploadArea.addEventListener('dragover', e => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });
  
  uploadArea.addEventListener('dragleave', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
  });
  
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length > 0) {
      handleImageUpload(files);
    }
  });
  
  // 文件选择上传
  fileInput.addEventListener('change', e => {
    if (e.target.files.length > 0) {
      handleImageUpload(Array.from(e.target.files));
    }
  });
}

// 处理图片上传
async function handleImageUpload(files) {
  const container = document.getElementById('uploaded-images');
  
  for (const file of files) {
    try {
      // 创建上传项
      const uploadItem = createUploadItem(file);
      container.appendChild(uploadItem);
      
      // 上传文件
      const result = await window.apiClient.files.upload(file);
      
      // 更新上传项状态
      updateUploadItem(uploadItem, result, file.name);
      
    } catch (error) {
      console.error('图片上传失败:', error);
      window.blogApp.showNotification(`图片 ${file.name} 上传失败`, 'error');
    }
  }
}

// 创建上传项
function createUploadItem(file) {
  const div = document.createElement('div');
  div.className = 'upload-item mb-2 p-2 border rounded';
  div.innerHTML = `
    <div class="d-flex align-items-center">
      <div class="upload-preview me-2">
        <i class="fas fa-image fa-2x text-muted"></i>
      </div>
      <div class="flex-grow-1">
        <div class="upload-name small fw-bold">${escapeHtml(file.name)}</div>
        <div class="upload-status small text-muted">上传中...</div>
      </div>
      <div class="upload-progress">
        <div class="spinner-border spinner-border-sm" role="status"></div>
      </div>
    </div>
  `;
  
  return div;
}

// 更新上传项状态
function updateUploadItem(uploadItem, result, filename) {
  const statusEl = uploadItem.querySelector('.upload-status');
  const progressEl = uploadItem.querySelector('.upload-progress');
  
  if (result && result.id) {
    statusEl.textContent = '上传成功';
    statusEl.className = 'small text-success';
    
    // 创建插入按钮
    progressEl.innerHTML = `
      <button class="btn btn-outline-primary btn-sm" onclick="insertImageMarkdown('${result.id}', '${filename}')">
        <i class="fas fa-plus"></i>
      </button>
    `;
  } else {
    statusEl.textContent = '上传失败';
    statusEl.className = 'small text-danger';
    progressEl.innerHTML = `<i class="fas fa-times text-danger"></i>`;
  }
}

// 插入图片 Markdown 语法
function insertImageMarkdown(fileId, filename) {
  const editor = document.getElementById('markdown-editor');
  const imageUrl = `/api/files/download/${fileId}`;
  const markdown = `![${filename}](${imageUrl})`;
  
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const value = editor.value;
  
  editor.value = value.substring(0, start) + markdown + value.substring(end);
  editor.selectionStart = editor.selectionEnd = start + markdown.length;
  editor.focus();
  
  markDirty();
  window.blogApp.showNotification('图片链接已插入', 'success');
}

// 保存文章
async function saveArticle(status = 'draft') {
  const title = document.getElementById('article-title').value.trim();
  const description = document.getElementById('article-description').value.trim();
  const content = document.getElementById('markdown-editor').value;
  const category = document.getElementById('article-category').value;
  const tags = document.getElementById('article-tags').value;
  
  if (!title) {
    window.blogApp.showNotification('请输入文章标题', 'error');
    return;
  }
  
  if (!content) {
    window.blogApp.showNotification('请输入文章内容', 'error');
    return;
  }
  
  try {
    // 显示保存状态
    const saveBtn = status === 'draft' ? 
      document.getElementById('save-draft-btn') : 
      document.getElementById('publish-btn');
    
    const originalText = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>保存中...';
    
    // 准备文章数据
    const articleData = {
      title,
      description,
      content,
      category,
      tags: tags.split(',').map(t => t.trim()).filter(t => t),
      status
    };
    
    let result;
    if (editorState.isEditing) {
      result = await window.apiClient.articles.update(editorState.articleId, articleData);
    } else {
      result = await window.apiClient.articles.create(articleData);
      editorState.isEditing = true;
      editorState.articleId = result.id;
    }
    
    editorState.isDirty = false;
    
    // 恢复按钮状态
    saveBtn.disabled = false;
    saveBtn.innerHTML = originalText;
    
    const message = status === 'published' ? '文章发布成功' : '草稿保存成功';
    window.blogApp.showNotification(message, 'success');
    
    // 如果是发布，跳转到列表页
    if (status === 'published') {
      setTimeout(() => {
        window.router.push('/admin/articles');
      }, 1000);
    }
    
  } catch (error) {
    console.error('保存失败:', error);
    window.blogApp.showNotification('保存失败: ' + error.message, 'error');
    
    // 恢复按钮状态
    const saveBtn = status === 'draft' ? 
      document.getElementById('save-draft-btn') : 
      document.getElementById('publish-btn');
    saveBtn.disabled = false;
    saveBtn.innerHTML = saveBtn === document.getElementById('save-draft-btn') ?
      '<i class="fas fa-save me-2"></i>保存草稿' :
      '<i class="fas fa-paper-plane me-2"></i>发布文章';
  }
}

// 加载文章内容（编辑模式）
async function loadArticleForEdit(articleId) {
  try {
    const article = await window.apiClient.articles.getDetail(articleId, 'latest');
    
    // 填充表单
    document.getElementById('article-title').value = article.title || '';
    document.getElementById('article-description').value = article.description || '';
    document.getElementById('article-category').value = article.category || '';
    document.getElementById('article-tags').value = (article.tags || []).join(', ');
    document.getElementById('markdown-editor').value = article.content || '';
    
    // 设置状态
    const statusRadio = document.querySelector(`input[name="article-status"][value="${article.status}"]`);
    if (statusRadio) {
      statusRadio.checked = true;
    }
    
    editorState.isDirty = false;
    
  } catch (error) {
    console.error('加载文章失败:', error);
    window.blogApp.showNotification('加载文章失败: ' + error.message, 'error');
  }
}

// 自动保存
function startAutoSave() {
  editorState.autoSaveTimer = setInterval(() => {
    if (editorState.isDirty && editorState.isEditing) {
      console.log('自动保存草稿...');
      // 这里可以实现自动保存逻辑
    }
  }, 30000); // 30秒自动保存一次
}

// 页面离开前检查
window.addEventListener('beforeunload', function(e) {
  if (editorState.isDirty) {
    e.preventDefault();
    e.returnValue = '您有未保存的更改，确定要离开吗？';
    return e.returnValue;
  }
});

// 工具函数
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>

<style>

  min-height: 500px;
  border: 1px solid var(--color-gray-4);
  border-radius: var(--radius-md);
  overflow: hidden;

.preview-pane {
  height: 100%;

}

  padding: 20px;
  height: 100%;
  overflow-y: auto;

}

.editor-container:fullscreen {
  background: var(--bg-primary);

.editor-container:fullscreen .editor-pane,
.editor-container:fullscreen .preview-pane {

</style>
