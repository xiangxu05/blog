<div class="container-wide py-4">
  <!-- 文章管理头部 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1">
        <i class="fas fa-newspaper me-2 text-primary"></i>
        文章管理
      </h1>
      <p class="text-muted mb-0">管理所有文章内容</p>
    </div>

<script>
// 文章列表页面初始化函数
window.initAdminArticleListPage = function(routeData) {
  console.log('初始化文章管理页面');
  
  // 检查管理员权限
  if (!window.appState.isAdmin()) {
    window.router.push('/404');
    return;
  }
  
  // 初始化页面状态
  initPageState();
  
  // 绑定事件
  bindEvents();
  
  // 加载文章列表
  loadArticles();
};

// 页面状态
if (typeof window.articlePageState === 'undefined') {
  window.articlePageState = {
    currentPage: 1,
    pageSize: 20,
    totalCount: 0,
    totalPages: 1,
    searchKeyword: '',
    statusFilter: '',
    sortBy: 'created_at_desc',
    selectedArticles: new Set(),
    articles: []
  };
}
var pageState = window.articlePageState;

// 初始化页面状态
function initPageState() {
  // 从URL参数获取初始状态
  const urlParams = new URLSearchParams(window.location.search);
  pageState.currentPage = parseInt(urlParams.get('page')) || 1;
  pageState.pageSize = parseInt(urlParams.get('pageSize')) || 20;
  pageState.searchKeyword = urlParams.get('search') || '';
  pageState.statusFilter = urlParams.get('status') || '';
  pageState.sortBy = urlParams.get('sort') || 'created_at_desc';
  
  // 更新表单控件
  document.getElementById('search-input').value = pageState.searchKeyword;
  document.getElementById('status-filter').value = pageState.statusFilter;
  document.getElementById('sort-filter').value = pageState.sortBy;
  document.getElementById('page-size-filter').value = pageState.pageSize;
}

// 绑定事件
function bindEvents() {
  // 搜索输入框
  const searchInput = document.getElementById('search-input');
  let searchTimeout;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      pageState.searchKeyword = this.value.trim();
      pageState.currentPage = 1;
      loadArticles();
    }, 500);
  });
  
  // 状态筛选
  document.getElementById('status-filter').addEventListener('change', function() {
    pageState.statusFilter = this.value;
    pageState.currentPage = 1;
    loadArticles();
  });
  
  // 排序筛选
  document.getElementById('sort-filter').addEventListener('change', function() {
    pageState.sortBy = this.value;
    pageState.currentPage = 1;
    loadArticles();
  });
  
  // 每页条数
  document.getElementById('page-size-filter').addEventListener('change', function() {
    pageState.pageSize = parseInt(this.value);
    pageState.currentPage = 1;
    loadArticles();
  });
  
  // 刷新按钮
  document.getElementById('refresh-btn').addEventListener('click', function() {
    loadArticles();
  });
  
  // 全选复选框
  document.getElementById('select-all').addEventListener('change', function() {
    const checkboxes = document.querySelectorAll('input[name="article-checkbox"]');
    checkboxes.forEach(checkbox => {
      checkbox.checked = this.checked;
      const articleId = parseInt(checkbox.value);
      if (this.checked) {
        pageState.selectedArticles.add(articleId);
      } else {
        pageState.selectedArticles.delete(articleId);
      }
    });
    updateBatchActions();
  });
  
  // 批量操作按钮
  document.getElementById('batch-delete-btn').addEventListener('click', showBatchDeleteModal);
  document.getElementById('batch-archive-btn').addEventListener('click', batchArchiveArticles);
  document.getElementById('clear-selection-btn').addEventListener('click', clearSelection);
  
  // 删除确认按钮
  document.getElementById('confirm-delete-btn').addEventListener('click', confirmDeleteArticle);
  document.getElementById('confirm-batch-delete-btn').addEventListener('click', confirmBatchDelete);
  
  // 重试按钮
  document.getElementById('retry-btn').addEventListener('click', loadArticles);
}

// 加载文章列表
async function loadArticles() {
  showLoading();
  
  try {
    const params = new URLSearchParams({
      page: pageState.currentPage,
      pageSize: pageState.pageSize,
      search: pageState.searchKeyword,
      status: pageState.statusFilter,
      sort: pageState.sortBy
    });
    
    const response = await fetch(`/api/admin/articles?${params}`, {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
      },
      credentials: 'include'
    });
    
    if (response.ok) {
      const result = await response.json();
      console.log('文章列表数据:', result);
      
      if (result.code === 200 && result.data) {
        pageState.articles = result.data.articles || [];
        pageState.totalCount = result.data.pagination?.total_count || 0;
        pageState.totalPages = result.data.pagination?.total_pages || 1;
        
        renderArticles();
        renderPagination();
        updateURL();
      } else {
        console.error('API返回错误:', result.msg || '未知错误');
        showError();
      }
    } else {
      console.error('获取文章列表失败:', response.status, response.statusText);
      showError();
    }
    
  } catch (error) {
    console.error('加载文章列表失败:', error);
    showError();
  }
}

// 显示加载状态
function showLoading() {
  document.getElementById('articles-loading').classList.remove('d-none');
  document.getElementById('articles-table').classList.add('d-none');
  document.getElementById('articles-empty').classList.add('d-none');
  document.getElementById('articles-error').classList.add('d-none');
}

// 显示错误状态
function showError() {
  document.getElementById('articles-loading').classList.add('d-none');
  document.getElementById('articles-table').classList.add('d-none');
  document.getElementById('articles-empty').classList.add('d-none');
  document.getElementById('articles-error').classList.remove('d-none');
}

// 渲染文章列表
function renderArticles() {
  const tbody = document.getElementById('articles-tbody');
  
  if (pageState.articles.length === 0) {
    document.getElementById('articles-loading').classList.add('d-none');
    document.getElementById('articles-table').classList.add('d-none');
    document.getElementById('articles-empty').classList.remove('d-none');
    document.getElementById('articles-error').classList.add('d-none');
    return;
  }
  
  const articlesHtml = pageState.articles.map(article => {
    const statusBadge = getStatusBadge(article.status);
    const createdAt = formatDate(article.created_at);
    const updatedAt = formatDate(article.updated_at);
    
    return `
      <tr>
        <td>
          <input type="checkbox" class="form-check-input" name="article-checkbox" value="${article.id}">
        </td>
        <td>
          <div>
            <h6 class="mb-1">
              <a href="/admin/articles/${article.id}/edit" class="text-decoration-none">
                ${escapeHtml(article.title)}
              </a>
            </h6>
            <div class="small text-muted">
              ${article.summary ? escapeHtml(article.summary.substring(0, 100)) + '...' : '暂无摘要'}
            </div>
          </div>
        </td>
        <td>${statusBadge}</td>
        <td>
          <span class="badge badge-info-custom">
            <i class="fas fa-eye me-1"></i>
            ${article.views || 0}
          </span>
        </td>
        <td>
          <small class="text-muted">${createdAt}</small>
        </td>
        <td>
          <small class="text-muted">${updatedAt}</small>
        </td>
        <td>
          <div class="btn-group btn-group-sm">
            <a href="/articles/${article.id}" class="btn btn-outline-info" title="预览" target="_blank">
              <i class="fas fa-eye"></i>
            </a>
            <a href="/admin/articles/${article.id}/edit" class="btn btn-outline-primary" title="编辑">
              <i class="fas fa-edit"></i>
            </a>
            <button class="btn btn-outline-danger" title="删除" onclick="showDeleteModal(${article.id}, '${escapeHtml(article.title)}')">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  
  tbody.innerHTML = articlesHtml;
  
  // 绑定复选框事件
  document.querySelectorAll('input[name="article-checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', function() {
      const articleId = parseInt(this.value);
      if (this.checked) {
        pageState.selectedArticles.add(articleId);
      } else {
        pageState.selectedArticles.delete(articleId);
      }
      updateBatchActions();
    });
  });
  
  // 显示表格
  document.getElementById('articles-loading').classList.add('d-none');
  document.getElementById('articles-table').classList.remove('d-none');
  document.getElementById('articles-empty').classList.add('d-none');
  document.getElementById('articles-error').classList.add('d-none');
  
  // 更新统计信息
  updateStatistics();
}

// 渲染分页
function renderPagination() {
  const pagination = document.getElementById('pagination');
  
  if (pageState.totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let paginationHtml = '';
  
  // 上一页
  if (pageState.currentPage > 1) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="goToPage(${pageState.currentPage - 1})">
          <i class="fas fa-chevron-left"></i>
        </a>
      </li>
    `;
  }
  
  // 页码
  const startPage = Math.max(1, pageState.currentPage - 2);
  const endPage = Math.min(pageState.totalPages, pageState.currentPage + 2);
  
  if (startPage > 1) {
    paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(1)">1</a></li>`;
    if (startPage > 2) {
      paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
    }
  }
  
  for (let i = startPage; i <= endPage; i++) {
    paginationHtml += `
      <li class="page-item ${i === pageState.currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
      </li>
    `;
  }
  
  if (endPage < pageState.totalPages) {
    if (endPage < pageState.totalPages - 1) {
      paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
    }
    paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${pageState.totalPages})">${pageState.totalPages}</a></li>`;
  }
  
  // 下一页
  if (pageState.currentPage < pageState.totalPages) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="goToPage(${pageState.currentPage + 1})">
          <i class="fas fa-chevron-right"></i>
        </a>
      </li>
    `;
  }
  
  pagination.innerHTML = paginationHtml;
}

// 跳转到指定页面
function goToPage(page) {
  pageState.currentPage = page;
  loadArticles();
}

// 更新统计信息
function updateStatistics() {
  document.getElementById('total-count').textContent = pageState.totalCount;
  document.getElementById('current-page').textContent = pageState.currentPage;
  document.getElementById('total-pages').textContent = pageState.totalPages;
}

// 更新批量操作
function updateBatchActions() {
  const selectedCount = pageState.selectedArticles.size;
  const batchActions = document.getElementById('batch-actions');
  const selectedCountElement = document.getElementById('selected-count');
  
  if (selectedCount > 0) {
    batchActions.style.display = 'block';
    selectedCountElement.textContent = selectedCount;
  } else {
    batchActions.style.display = 'none';
  }
  
  // 更新全选复选框状态
  const selectAllCheckbox = document.getElementById('select-all');
  const checkboxes = document.querySelectorAll('input[name="article-checkbox"]');
  const checkedCount = document.querySelectorAll('input[name="article-checkbox"]:checked').length;
  
  if (checkedCount === 0) {
    selectAllCheckbox.indeterminate = false;
    selectAllCheckbox.checked = false;
  } else if (checkedCount === checkboxes.length) {
    selectAllCheckbox.indeterminate = false;
    selectAllCheckbox.checked = true;
  } else {
    selectAllCheckbox.indeterminate = true;
  }
}

// 清除选择
function clearSelection() {
  pageState.selectedArticles.clear();
  document.querySelectorAll('input[name="article-checkbox"]').forEach(checkbox => {
    checkbox.checked = false;
  });
  updateBatchActions();
}

// 显示删除模态框
function showDeleteModal(articleId, articleTitle) {
  document.getElementById('delete-article-title').textContent = articleTitle;
  document.getElementById('confirm-delete-btn').setAttribute('data-article-id', articleId);
  
  const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
  modal.show();
}

// 确认删除文章
async function confirmDeleteArticle() {
  const articleId = document.getElementById('confirm-delete-btn').getAttribute('data-article-id');
  
  try {
    const response = await fetch(`/api/admin/articles/${articleId}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
      },
      credentials: 'include'
    });
    
    if (response.ok) {
      window.blogApp.showNotification('文章删除成功', 'success');
      
      // 关闭模态框
      const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
      modal.hide();
      
      // 重新加载列表
      loadArticles();
    } else {
      const result = await response.json();
      window.blogApp.showNotification(result.message || '删除失败', 'error');
    }
    
  } catch (error) {
    console.error('删除文章失败:', error);
    window.blogApp.showNotification('删除失败，请稍后重试', 'error');
  }
}

// 显示批量删除模态框
function showBatchDeleteModal() {
  const selectedCount = pageState.selectedArticles.size;
  document.getElementById('batch-delete-count').textContent = selectedCount;
  
  const modal = new bootstrap.Modal(document.getElementById('batchDeleteModal'));
  modal.show();
}

// 确认批量删除
async function confirmBatchDelete() {
  const selectedIds = Array.from(pageState.selectedArticles);
  
  try {
    const promises = selectedIds.map(id => 
      fetch(`/api/admin/articles/${id}`, {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json',
        },
        credentials: 'include'
      })
    );
    
    const results = await Promise.allSettled(promises);
    const successCount = results.filter(result => result.status === 'fulfilled' && result.value.ok).length;
    const failCount = selectedIds.length - successCount;
    
    if (successCount > 0) {
      window.blogApp.showNotification(`成功删除 ${successCount} 篇文章${failCount > 0 ? `，${failCount} 篇失败` : ''}`, 
        failCount > 0 ? 'warning' : 'success');
    } else {
      window.blogApp.showNotification('批量删除失败', 'error');
    }
    
    // 关闭模态框
    const modal = bootstrap.Modal.getInstance(document.getElementById('batchDeleteModal'));
    modal.hide();
    
    // 清除选择并重新加载
    clearSelection();
    loadArticles();
    
  } catch (error) {
    console.error('批量删除失败:', error);
    window.blogApp.showNotification('批量删除失败，请稍后重试', 'error');
  }
}

// 批量归档文章
async function batchArchiveArticles() {
  const selectedIds = Array.from(pageState.selectedArticles);
  
  try {
    const promises = selectedIds.map(id => 
      fetch(`/api/admin/articles/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
        },
        credentials: 'include',
        body: JSON.stringify({ status: 'archived' })
      })
    );
    
    const results = await Promise.allSettled(promises);
    const successCount = results.filter(result => result.status === 'fulfilled' && result.value.ok).length;
    const failCount = selectedIds.length - successCount;
    
    if (successCount > 0) {
      window.blogApp.showNotification(`成功归档 ${successCount} 篇文章${failCount > 0 ? `，${failCount} 篇失败` : ''}`, 
        failCount > 0 ? 'warning' : 'success');
    } else {
      window.blogApp.showNotification('批量归档失败', 'error');
    }
    
    // 清除选择并重新加载
    clearSelection();
    loadArticles();
    
  } catch (error) {
    console.error('批量归档失败:', error);
    window.blogApp.showNotification('批量归档失败，请稍后重试', 'error');
  }
}

// 更新URL参数
function updateURL() {
  const params = new URLSearchParams();
  if (pageState.currentPage > 1) params.set('page', pageState.currentPage);
  if (pageState.pageSize !== 20) params.set('pageSize', pageState.pageSize);
  if (pageState.searchKeyword) params.set('search', pageState.searchKeyword);
  if (pageState.statusFilter) params.set('status', pageState.statusFilter);
  if (pageState.sortBy !== 'created_at_desc') params.set('sort', pageState.sortBy);
  
  const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  window.history.replaceState({}, '', newURL);
}

// 工具函数
function formatDate(dateString) {
  if (!dateString) return '-';
  const date = new Date(dateString);
  return date.toLocaleDateString('zh-CN', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  });
}

function getStatusBadge(status) {
  const statusMap = {
    'published': '<span class="badge badge-success-custom">已发布</span>',
    'draft': '<span class="badge badge-secondary-custom">草稿</span>',
    'private': '<span class="badge badge-warning-custom">私有</span>',
    'archived': '<span class="badge badge-info-custom">归档</span>'
  };
  
  return statusMap[status] || '<span class="badge badge-secondary-custom">未知</span>';
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
