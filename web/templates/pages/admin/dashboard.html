<script>
// 管理后台仪表板初始化函数
window.initAdminDashboardPage = function(routeData) {
  console.log('初始化管理后台仪表板');
  
  // 检查管理员权限
  if (!window.appState.isAdmin()) {
    window.router.push('/404');
    return;
  }
  
  // 加载仪表板数据
  loadDashboardData();
  
  // 绑定事件
  bindDashboardEvents();
};

// 加载仪表板数据
async function loadDashboardData() {
  // 并行加载各种数据
  await Promise.all([
    loadStatistics(),
    loadRecentArticles(),
    loadPopularArticles(),
    loadRecentActivities()
  ]);
}

// 加载统计数据
async function loadStatistics() {
  try {
    const response = await fetch('/api/admin/backend_statistics', {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
      },
      credentials: 'include' // 包含认证信息
    });
    
    if (response.ok) {
      const result = await response.json();
      console.log('后台统计数据:', result);
      
      // 数据在 result.data 中
      const data = result.data || {};
      
      // 更新统计卡片
      document.getElementById('total-articles').textContent = data.articles_num || '0';
      document.getElementById('total-views').textContent = formatNumber(data.views || 0);
      document.getElementById('total-files').textContent = data.files_num || '0';
      document.getElementById('total-users').textContent = data.users_num || '0';
      
      // 更新系统状态
      document.getElementById('storage-usage').textContent = data.store_usage || '-';
      document.getElementById('storage-capacity').textContent = data.capacity || '-';
      
      // 更新最后备份时间
      const lastBackupElement = document.getElementById('last-backup');
      if (data.last_backup) {
        try {
          const backupDate = new Date(data.last_backup);
          if (!isNaN(backupDate.getTime())) {
            lastBackupElement.textContent = backupDate.toLocaleDateString('zh-CN');
          } else {
            lastBackupElement.textContent = '未知';
          }
        } catch (error) {
          console.error('解析备份时间失败:', error);
          lastBackupElement.textContent = '未知';
        }
      } else {
        lastBackupElement.textContent = '从未备份';
      }
      
      // 更新运行时间（这个可能需要单独的API或计算）
      document.getElementById('uptime').textContent = '运行中';
      
    } else {
      console.error('获取后台统计数据失败:', response.status, response.statusText);
      // 显示错误状态
      document.getElementById('total-articles').textContent = '-';
      document.getElementById('total-views').textContent = '-';
      document.getElementById('total-files').textContent = '-';
      document.getElementById('total-users').textContent = '-';
    }
    
  } catch (error) {
    console.error('加载统计数据失败:', error);
    // 显示错误状态
    document.getElementById('total-articles').textContent = '-';
    document.getElementById('total-views').textContent = '-';
    document.getElementById('total-files').textContent = '-';
    document.getElementById('total-users').textContent = '-';
  }
}

// 加载最近文章
async function loadRecentArticles() {
  const recentArticlesLoading = document.getElementById('recent-articles-loading');
  const recentArticlesList = document.getElementById('recent-articles-list');
  const recentArticlesEmpty = document.getElementById('recent-articles-empty');
  
  try {
    // 获取最近文章（使用管理员API）
    const response = await window.apiClient.admin.getArticles({ page: 1, pageSize: 5 });
    
    recentArticlesLoading.classList.add('d-none');
    
    if (response.articles && response.articles.length > 0) {
      renderRecentArticles(response.articles);
      recentArticlesList.classList.remove('d-none');
    } else {
      recentArticlesEmpty.classList.remove('d-none');
    }
    
  } catch (error) {
    console.error('加载最近文章失败:', error);
    recentArticlesLoading.classList.add('d-none');
    
    // 使用模拟数据
    const mockArticles = [
      {
        id: 1,
        title: 'Vue.js 3.0 深度解析',
        created_at: Date.now() / 1000 - 3600,
        status: 'published',
        views: 1250
      },
      {
        id: 2,
        title: 'JavaScript 异步编程详解',
        created_at: Date.now() / 1000 - 7200,
        status: 'published',
        views: 980
      },
      {
        id: 3,
        title: '前端性能优化实践',
        created_at: Date.now() / 1000 - 10800,
        status: 'draft',
        views: 756
      }
    ];
    
    renderRecentArticles(mockArticles);
    recentArticlesList.classList.remove('d-none');
  }
}

// 渲染最近文章
function renderRecentArticles(articles) {
  const recentArticlesList = document.getElementById('recent-articles-list');
  
  const articlesHtml = articles.map(article => {
    const timeAgo = getTimeAgo(article.created_at);
    const statusBadge = getStatusBadge(article.status);
    
    return `
      <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
        <div class="flex-grow-1">
          <h6 class="mb-1">
            <a href="/admin/articles/${article.id}/edit" class="text-decoration-none">
              ${escapeHtml(article.title)}
            </a>
          </h6>
          <div class="small text-muted">
            <i class="fas fa-clock me-1"></i>
            ${timeAgo}
            <span class="mx-2">•</span>
            <i class="fas fa-eye me-1"></i>
            ${article.views || 0} 次浏览
          </div>
        </div>
        <div class="ms-3">
          ${statusBadge}
        </div>
      </div>
    `;
  }).join('');
  
  recentArticlesList.innerHTML = articlesHtml;
}

// 加载热门文章
async function loadPopularArticles() {
  const popularArticles = document.getElementById('popular-articles');
  
  // 检查元素是否存在，如果不存在则跳过
  if (!popularArticles) {
    console.log('热门文章容器不存在，跳过加载');
    return;
  }
  
  try {
    // 模拟热门文章数据
    setTimeout(() => {
      const mockPopular = [
        { title: 'Vue.js 3.0 深度解析', views: 1250 },
        { title: 'JavaScript 异步编程详解', views: 980 },
        { title: '前端性能优化实践', views: 756 },
        { title: 'CSS Grid 布局详解', views: 642 },
        { title: 'Node.js 实战指南', views: 521 }
      ];
      
      const popularHtml = mockPopular.map((article, index) => `
        <div class="d-flex align-items-center mb-3">
          <div class="badge badge-primary-custom me-3">${index + 1}</div>
          <div class="flex-grow-1">
            <h6 class="mb-1 small">${escapeHtml(article.title)}</h6>
            <div class="small text-muted">
              <i class="fas fa-eye me-1"></i>
              ${formatNumber(article.views)} 次浏览
            </div>
          </div>
        </div>
      `).join('');
      
      if (popularArticles) {
        popularArticles.innerHTML = popularHtml;
      }
    }, 1000);
    
  } catch (error) {
    if (popularArticles) {
      popularArticles.innerHTML = '<p class="text-muted small">加载失败</p>';
    }
  }
}

          color: 'primary'

        {

          action: '上传了文件',
          target: 'vue-logo.png',

        {
          type: 'article',
          action: '更新了文章',
          target: 'JavaScript 异步编程详解',
          time: Date.now() / 1000 - 7200,
          icon: 'fas fa-edit',

        {
          type: 'system',

      const activitiesHtml = activities.map(activity => `
        <div class="d-flex align-items-center mb-3">

            <i class="${activity.icon} text-${activity.color}"></i>

// 绑定事件

  // 清理缓存按钮
  document.getElementById('clear-cache-btn')?.addEventListener('click', function() {
    if (confirm('确定要清理缓存吗？')) {
      window.blogApp.showNotification('缓存清理完成', 'success');
    }
  });
  
  // 数据备份按钮
  document.getElementById('backup-data-btn')?.addEventListener('click', function() {
    window.blogApp.showNotification('数据备份功能即将上线', 'info');
  });
  
  // 图表时间范围切换
  document.querySelectorAll('input[name="chart-period"]').forEach(radio => {
    radio.addEventListener('change', function() {
      console.log('切换图表时间范围:', this.value);
      // 这里可以重新加载图表数据
    });
  });
}

// 工具函数
function formatNumber(num) {
  if (num >= 1000000) {
    return (num / 1000000).toFixed(1) + 'M';
  } else if (num >= 1000) {
    return (num / 1000).toFixed(1) + 'K';
  }
  return num.toString();
}

function getTimeAgo(timestamp) {
  const now = Date.now() / 1000;
  const diff = now - timestamp;
  
  if (diff < 60) {
    return '刚刚';
  } else if (diff < 3600) {
    return `${Math.floor(diff / 60)} 分钟前`;
  } else if (diff < 86400) {
    return `${Math.floor(diff / 3600)} 小时前`;
  } else {
    return `${Math.floor(diff / 86400)} 天前`;
  }
}

function getStatusBadge(status) {
  const statusMap = {
    'published': '<span class="badge badge-success-custom">已发布</span>',
    'draft': '<span class="badge badge-secondary-custom">草稿</span>',
    'private': '<span class="badge badge-warning-custom">私有</span>',
    'archived': '<span class="badge badge-info-custom">归档</span>'
  };
  
  return statusMap[status] || '<span class="badge badge-secondary-custom">未知</span>';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
