<div class="container-wide py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card-custom">
        <div class="card-body">
          <div class="text-center mb-4">
            <h2 class="card-title">用户注册</h2>
            <p class="text-muted">创建您的个人账户</p>
          </div>
          
          <form id="register-form">
            <div class="mb-3">
              <label for="username" class="form-label-custom">用户名 *</label>
              <input type="text" class="form-control form-control-custom" id="username" name="username" required>
              <div class="form-text">3-20个字符，只能包含字母、数字和下划线</div>
              <div class="invalid-feedback" id="username-error"></div>
            </div>
            
            <div class="mb-3">
              <label for="email" class="form-label-custom">邮箱地址 *</label>
              <input type="email" class="form-control form-control-custom" id="email" name="email" required>
              <div class="form-text">用于接收重要通知</div>
              <div class="invalid-feedback" id="email-error"></div>
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label-custom">密码 *</label>
              <div class="position-relative">
                <input type="password" class="form-control form-control-custom" id="password" name="password" required>
                <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-2" id="toggle-password" style="border: none; background: none;">
                  <i class="fas fa-eye text-muted"></i>
                </button>
              </div>
              <div class="form-text">至少6个字符，建议包含字母和数字</div>
              <div class="invalid-feedback" id="password-error"></div>
            </div>
            
            <div class="mb-3">
              <label for="confirm-password" class="form-label-custom">确认密码 *</label>
              <div class="position-relative">
                <input type="password" class="form-control form-control-custom" id="confirm-password" name="confirmPassword" required>
                <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-2" id="toggle-confirm-password" style="border: none; background: none;">
                  <i class="fas fa-eye text-muted"></i>
                </button>
              </div>
              <div class="invalid-feedback" id="confirm-password-error"></div>
            </div>
            
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="agree-terms" name="agreeTerms" required>
              <label class="form-check-label" for="agree-terms">
                我已阅读并同意<a href="#" class="text-decoration-none">服务条款</a>和<a href="#" class="text-decoration-none">隐私政策</a>
              </label>
              <div class="invalid-feedback" id="agree-terms-error"></div>
            </div>
            
            <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="register-btn">
              <span class="btn-text">注册账户</span>
              <span class="spinner-border spinner-border-sm d-none" id="register-spinner"></span>
            </button>
            
            <div class="text-center">
              <p class="mb-0">
                已有账户？
                <a href="/login" class="text-decoration-none">立即登录</a>
              </p>
            </div>
          </form>
          
          <!-- 错误提示 -->
          <div class="alert alert-danger-custom d-none" id="register-error" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="register-error-message"></span>
          </div>
          
          <!-- 成功提示 -->
          <div class="alert alert-success-custom d-none" id="register-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span id="register-success-message"></span>
          </div>
        </div>
      </div>
      
      <!-- 注册须知 -->
      <div class="card-custom mt-4">
        <div class="card-body">
          <h6 class="card-title">
            <i class="fas fa-shield-alt me-2"></i>
            注册须知
          </h6>
          <ul class="list-unstyled mb-0 small text-muted">
            <li><i class="fas fa-check text-success me-2"></i>个人信息安全保护</li>
            <li><i class="fas fa-check text-success me-2"></i>支持修改个人资料</li>
            <li><i class="fas fa-check text-success me-2"></i>完全免费使用</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// 注册页面初始化函数
window.initRegisterPage = function(routeData) {
  console.log('初始化注册页面');
  
  const form = document.getElementById('register-form');
  const usernameInput = document.getElementById('username');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirm-password');
  const agreeTermsInput = document.getElementById('agree-terms');
  const togglePasswordBtn = document.getElementById('toggle-password');
  const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password');
  const registerBtn = document.getElementById('register-btn');
  const registerSpinner = document.getElementById('register-spinner');
  const registerError = document.getElementById('register-error');
  const registerSuccess = document.getElementById('register-success');
  
  // 密码显示/隐藏切换
  [togglePasswordBtn, toggleConfirmPasswordBtn].forEach((btn, index) => {
    if (btn) {
      btn.addEventListener('click', function() {
        const input = index === 0 ? passwordInput : confirmPasswordInput;
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        
        const icon = this.querySelector('i');
        icon.className = type === 'password' ? 'fas fa-eye text-muted' : 'fas fa-eye-slash text-muted';
      });
    }
  });
  
  // 表单验证
  function validateForm() {
    let isValid = true;
    
    // 验证用户名
    const username = usernameInput.value.trim();
    if (!username) {
      showFieldError('username', '请输入用户名');
      isValid = false;
    } else if (username.length < 3 || username.length > 20) {
      showFieldError('username', '用户名长度为3-20个字符');
      isValid = false;
    } else if (!/^[a-zA-Z0-9_]+$/.test(username)) {
      showFieldError('username', '用户名只能包含字母、数字和下划线');
      isValid = false;
    } else {
      clearFieldError('username');
    }
    
    // 验证邮箱
    const email = emailInput.value.trim();
    if (!email) {
      showFieldError('email', '请输入邮箱地址');
      isValid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFieldError('email', '请输入有效的邮箱地址');
      isValid = false;
    } else {
      clearFieldError('email');
    }
    
    // 验证密码
    const password = passwordInput.value;
    if (!password) {
      showFieldError('password', '请输入密码');
      isValid = false;
    } else if (password.length < 6) {
      showFieldError('password', '密码至少6个字符');
      isValid = false;
    } else if (password.length > 50) {
      showFieldError('password', '密码不能超过50个字符');
      isValid = false;
    } else {
      clearFieldError('password');
    }
    
    // 验证确认密码
    const confirmPassword = confirmPasswordInput.value;
    if (!confirmPassword) {
      showFieldError('confirm-password', '请确认密码');
      isValid = false;
    } else if (password !== confirmPassword) {
      showFieldError('confirm-password', '两次输入的密码不一致');
      isValid = false;
    } else {
      clearFieldError('confirm-password');
    }
    
    // 验证服务条款
    if (!agreeTermsInput.checked) {
      showFieldError('agree-terms', '请阅读并同意服务条款');
      isValid = false;
    } else {
      clearFieldError('agree-terms');
    }
    
    return isValid;
  }
  
  // 显示字段错误
  function showFieldError(fieldName, message) {
    const field = document.getElementById(fieldName);
    const errorEl = document.getElementById(fieldName + '-error');
    
    if (field) {
      field.classList.add('is-invalid');
    }
    if (errorEl) {
      errorEl.textContent = message;
    }
  }
  
  // 清除字段错误
  function clearFieldError(fieldName) {
    const field = document.getElementById(fieldName);
    const errorEl = document.getElementById(fieldName + '-error');
    
    if (field) {
      field.classList.remove('is-invalid');
    }
    if (errorEl) {
      errorEl.textContent = '';
    }
  }
  
  // 显示全局错误
  function showError(message) {
    if (registerError) {
      document.getElementById('register-error-message').textContent = message;
      registerError.classList.remove('d-none');
    }
    if (registerSuccess) {
      registerSuccess.classList.add('d-none');
    }
  }
  
  // 显示成功信息
  function showSuccess(message) {
    if (registerSuccess) {
      document.getElementById('register-success-message').textContent = message;
      registerSuccess.classList.remove('d-none');
    }
    if (registerError) {
      registerError.classList.add('d-none');
    }
  }
  
  // 隐藏所有提示
  function hideMessages() {
    if (registerError) {
      registerError.classList.add('d-none');
    }
    if (registerSuccess) {
      registerSuccess.classList.add('d-none');
    }
  }
  
  // 设置加载状态
  function setLoading(loading) {
    if (registerBtn && registerSpinner) {
      if (loading) {
        registerBtn.disabled = true;
        registerBtn.querySelector('.btn-text').textContent = '注册中...';
        registerSpinner.classList.remove('d-none');
      } else {
        registerBtn.disabled = false;
        registerBtn.querySelector('.btn-text').textContent = '注册账户';
        registerSpinner.classList.add('d-none');
      }
    }
  }
  
  // 表单提交处理
  if (form) {
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // 隐藏之前的消息
      hideMessages();
      
      // 验证表单
      if (!validateForm()) {
        return;
      }
      
      try {
        // 设置加载状态
        setLoading(true);
        
        // 获取表单数据
        const formData = new FormData(form);
        const userData = {
          username: formData.get('username').trim(),
          email: formData.get('email').trim(),
          password: formData.get('password'),
          confirmPassword: formData.get('confirmPassword')
        };
        
        // 调用注册API
        await window.apiClient.user.register(userData);
        
        // 显示成功消息
        showSuccess('注册成功！正在跳转到登录页面...');
        
        // 延迟跳转到登录页面
        setTimeout(() => {
          window.router.push('/login');
        }, 2000);
        
      } catch (error) {
        console.error('注册失败:', error);
        showError(error.message || '注册失败，请稍后重试');
      } finally {
        setLoading(false);
      }
    });
  }
  
  // 输入时清除错误状态
  [usernameInput, emailInput, passwordInput, confirmPasswordInput].forEach(input => {
    if (input) {
      input.addEventListener('input', function() {
        if (this.classList.contains('is-invalid')) {
          clearFieldError(this.name || this.id);
        }
        hideMessages();
        
        // 密码确认实时验证
        if (this === confirmPasswordInput && this.value && passwordInput.value) {
          if (this.value !== passwordInput.value) {
            showFieldError('confirm-password', '两次输入的密码不一致');
          } else {
            clearFieldError('confirm-password');
          }
        }
      });
    }
  });
  
  // 服务条款点击处理
  if (agreeTermsInput) {
    agreeTermsInput.addEventListener('change', function() {
      if (this.classList.contains('is-invalid')) {
        clearFieldError('agree-terms');
      }
      hideMessages();
    });
  }
  
  // 聚焦到用户名输入框
  if (usernameInput) {
    usernameInput.focus();
  }
};
</script>
