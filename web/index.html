<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XX者说</title>
    <meta name="description" content="XX者说 - 分享技术与生活">

    <!-- 字体：界面无衬线 + 正文衬线（阅读感） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/assets/css/base.css?v=1.0.5" rel="stylesheet">
    <link href="/assets/css/components.css?v=1.0.15" rel="stylesheet">
    <link href="/assets/css/themes.css?v=1.0.3" rel="stylesheet">
    <link href="/assets/css/utilities.css?v=1.0.3" rel="stylesheet">
    <!-- 网站图标 -->
    <link rel="icon" type="image/jpeg" href="/assets/img/favicon.jpg">
    <link rel="shortcut icon" href="/assets/img/favicon.jpg">
    <link rel="apple-touch-icon" href="/assets/img/favicon.jpg">
</head>

<body data-theme="light" class="blog-body">
    <!-- 导航栏 -->
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light navbar-blog fixed-top">
        <div class="container-wide">
            <a class="navbar-brand navbar-brand-blog" href="/">
                <span class="navbar-brand-mark" aria-hidden="true"><i class="fas fa-feather-alt"></i></span>
                <span class="navbar-brand-text">XX者说</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articles">文章</a>
                    </li>
                    <li class="nav-item d-none" id="nav-bookmarks">
                        <a class="nav-link" href="/bookmarks"><i class="fas fa-bookmark me-1"></i>收藏</a>
                    </li>
                    <li class="nav-item d-flex align-items-center">
                        <button type="button" class="btn btn-link nav-link py-2 border-0" id="navbar-search-btn" title="搜索 (Ctrl+K)" aria-label="搜索">
                            <i class="fas fa-search"></i>
                        </button>
                    </li>
                    <!-- 未登录状态 -->
                    <li class="nav-item d-none" id="nav-guest">
                        <a class="nav-link" href="/login">登录</a>
                    </li>
                    <li class="nav-item d-none" id="nav-guest-register">
                        <a class="nav-link" href="/register">注册</a>
                    </li>
                    <!-- 已登录状态 -->
                    <li class="nav-item dropdown d-none" id="nav-user">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <img id="nav-avatar" src="/assets/images/default-avatar.svg?v=2" alt="头像" class="rounded-circle me-1" width="24" height="24">
                            <span id="nav-username"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/profile">个人资料</a></li>
                            <li><a class="dropdown-item" href="/bookmarks"><i class="fas fa-bookmark me-2 text-muted"></i>我的收藏</a></li>
                            <li class="d-none" id="nav-admin"><a class="dropdown-item" href="/admin">管理后台</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" id="logout-btn">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main id="main-content" class="main-content-blog">
        <!-- 页面内容将通过JavaScript动态加载到这里 -->
        <div id="page-content">
            <!-- 加载指示器 -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 全局搜索（Ctrl+K） -->
    <div class="modal fade" id="global-search-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title"><i class="fas fa-search me-2"></i>搜索文章</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body modal-body-custom">
                    <form id="global-search-form">
                        <input type="text" class="form-control form-control-custom" id="global-search-input"
                            placeholder="输入关键词，回车跳转至文章列表" autocomplete="off">
                    </form>
                    <p class="text-muted small mt-2 mb-0">快捷键：Ctrl+K / ⌘K</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer mt-5">
        <div class="container-wide">
            <div class="site-footer-inner">
                <div class="site-footer-brand-block">
                    <span class="site-footer-logo"><i class="fas fa-feather-alt" aria-hidden="true"></i></span>
                    <div>
                        <div class="site-footer-title">XX者说</div>
                        <p class="site-footer-tagline">技术 · 笔记 · 生活</p>
                    </div>
                </div>
                <div class="site-footer-meta text-md-end">
                    <p class="site-footer-copy mb-1">&copy; <span id="site-footer-year"></span> 个人博客</p>
                    <a href="/articles" class="site-footer-link">文章</a>
                    <span class="site-footer-dot" aria-hidden="true">·</span>
                    <a href="/" class="site-footer-link">首页</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Toast 通知容器 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i id="toast-icon" class="fas fa-info-circle me-2"></i>
                <strong id="toast-title" class="me-auto">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div id="toast-body" class="toast-body">
                <!-- 消息内容 -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS（含国内镜像回退） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        onerror="this.onerror=null;this.src='https://cdn.staticfile.net/bootstrap/5.3.0/js/bootstrap.bundle.min.js'"></script>
    <!-- Page.js 1.11.6：本地补丁修复 popstate 时 e.state 无 path 导致 Context 崩溃 -->
    <script src="/assets/js/vendor/page.js?v=1.11.6-p1"></script>
    <!-- Marked.js Markdown解析（含回退） -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"
        onerror="this.onerror=null;this.src='https://cdn.staticfile.net/marked/9.1.2/marked.min.js'"></script>
    <!-- Highlight.js 代码高亮（含回退） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        onerror="this.onerror=null;this.src='https://cdn.staticfile.net/highlight.js/11.9.0/highlight.min.js'"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css"
        id="highlight-theme-light"
        onerror="this.onerror=null;this.href='https://cdn.staticfile.net/highlight.js/11.9.0/styles/atom-one-light.min.css'">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
        id="highlight-theme-dark" disabled
        onerror="this.onerror=null;this.href='https://cdn.staticfile.net/highlight.js/11.9.0/styles/atom-one-dark.min.css'">
    <!-- 数学公式支持（含回退） -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"
        onerror="this.onerror=null;this.src='https://cdn.staticfile.net/KaTeX/0.16.4/katex.min.js'"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css"
        onerror="this.onerror=null;this.href='https://cdn.staticfile.net/KaTeX/0.16.4/katex.min.css'">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js"
        onerror="this.onerror=null;this.src='https://cdn.staticfile.net/KaTeX/0.16.4/contrib/auto-render.min.js'"></script>

    <!-- 应用核心文件 -->
    <script src="/assets/js/utils/markdown.js?v=1.0.1"></script>
    <script src="/assets/js/utils/ux.js?v=1.0.1"></script>
    <script src="/assets/js/core/state.js?v=1.0.1"></script>
    <script src="/assets/js/core/api.js?v=1.0.4"></script>
    <script src="/assets/js/core/router.js?v=1.0.5"></script>
    <script src="/assets/js/core/app.js?v=1.0.2"></script>
    <script>
      (function () {
        var el = document.getElementById('site-footer-year');
        if (el) el.textContent = new Date().getFullYear();
      })();
    </script>
</body>

</html>
